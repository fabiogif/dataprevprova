`Regra padrão: rollback para <b>unchecked</b> (RuntimeException e Error); para <b>checked</b>, faz commit — a menos que se use <code>@Transactional(rollbackFor = Exception.class)</code>. Outra pegadinha: por funcionar via <b>proxy</b>, chamar um método @Transactional de <b>dentro da mesma classe</b> (self-invocation) não abre transação. Propagação padrão: <b>REQUIRED</b>.`],

[`es`,`Spring Data JPA`,`<p>Em um repositório Spring Data JPA, o método <code>List&lt;Servidor&gt; findByLotacaoAndSalarioGreaterThan(String lotacao, BigDecimal valor)</code>:</p>`,
[`gera erro, pois toda consulta precisa de @Query.`,`deve ser implementado manualmente em uma classe concreta.`,`executa um DELETE nos registros correspondentes.`,`retorna apenas o primeiro registro encontrado.`,`tem a consulta derivada automaticamente do nome do método, filtrando por lotação igual e salário maior que o valor informado.`],`E`,
`<b>Query methods</b>: o Spring Data interpreta o nome (findBy, And, Or, GreaterThan, Like, Between, OrderBy…) e gera a JPQL. Interfaces: CrudRepository → PagingAndSortingRepository → <b>JpaRepository</b>. Para consultas complexas: <b>@Query</b> (JPQL ou nativeQuery = true).`],

[`es`,`Spring Security`,`<p>Sobre o Spring Security, assinale a afirmativa correta.</p>`,
[`Autenticação verifica o que o usuário pode fazer; autorização verifica quem ele é.`,`Senhas devem ser armazenadas com um PasswordEncoder adaptativo, como BCryptPasswordEncoder, e a segurança HTTP é configurada por meio de uma cadeia de filtros (SecurityFilterChain).`,`O Spring Security armazena senhas em texto claro por padrão para facilitar a recuperação.`,`O Spring Security funciona apenas em aplicações JSF.`,`A proteção contra CSRF deve ser desabilitada em qualquer aplicação com formulários.`],`B`,
`<b>Autenticação</b> = quem você é; <b>autorização</b> = o que você pode fazer (A inverte). O Spring Security atua como <b>cadeia de filtros</b> de servlet; no Spring Boot 3, configura-se um bean <code>SecurityFilterChain</code> (o antigo WebSecurityConfigurerAdapter foi removido). Senhas: <b>BCrypt</b>/Argon2 (hash com salt, lento de propósito). CSRF fica <b>habilitado</b> por padrão; costuma-se desabilitar apenas em APIs stateless com token (não baseadas em cookie de sessão).`],

[`es`,`JWT`,`<p>Um JSON Web Token (JWT) assinado (JWS) é composto por header, payload e signature. Sobre ele, é correto afirmar que:</p>`,
[`o payload é criptografado e, portanto, pode conter senhas com segurança.`,`a assinatura impede que qualquer pessoa leia o conteúdo do token.`,`o token não pode ter data de expiração.`,`o payload é apenas codificado em Base64URL, podendo ser lido por qualquer um; a assinatura garante a integridade e a autenticidade do emissor.`,`o JWT só pode ser usado com o protocolo SOAP.`],`D`,
`JWT = <code>header.payload.signature</code>, cada parte em <b>Base64URL</b> (codificação ≠ criptografia!). A assinatura (HMAC ou RSA/ECDSA) garante <b>integridade</b> — se alguém alterar o payload, a verificação falha. Nunca coloque dados sensíveis no payload (para sigilo existe o <b>JWE</b>). Claims comuns: <b>sub</b>, <b>iss</b>, <b>exp</b>, <b>iat</b>, <b>aud</b>.`],

[`es`,`OAuth 2.0 / OpenID Connect`,`<p>Sobre OAuth 2.0 e OpenID Connect (OIDC), é correto afirmar que:</p>`,
[`OAuth 2.0 é um protocolo de autorização delegada; o OIDC é uma camada de identidade sobre ele que adiciona o ID Token para autenticação, e o fluxo Authorization Code com PKCE é o recomendado para aplicações móveis e SPAs.`,`OAuth 2.0 é exclusivamente um protocolo de autenticação e dispensa tokens.`,`O fluxo Implicit é o mais recomendado atualmente para SPAs.`,`O OIDC substitui o HTTPS na proteção dos tokens.`,`No OAuth 2.0, o cliente sempre recebe a senha do usuário.`],`A`,
`Papéis OAuth 2.0: <b>resource owner</b> (usuário), <b>client</b> (app), <b>authorization server</b> (emite tokens), <b>resource server</b> (API). OAuth = <b>autorização</b> (access token); <b>OIDC</b> = autenticação (<b>ID Token</b>, um JWT), usado pelo gov.br. O fluxo <b>Implicit</b> e o <b>Password</b> estão desaconselhados; use <b>Authorization Code + PKCE</b>. Para comunicação entre serviços (sem usuário): <b>Client Credentials</b>.`],

[`es`,`Spring Cloud`,`<p>Associe corretamente os componentes do ecossistema Spring Cloud às suas funções: (1) Spring Cloud Config; (2) Eureka; (3) Resilience4j (circuit breaker); (4) Spring Cloud Gateway.</p><p>( ) Descoberta e registro de serviços<br>( ) Ponto único de entrada, com roteamento e filtros<br>( ) Configuração centralizada e externalizada<br>( ) Evitar falhas em cascata, interrompendo chamadas a um serviço instável</p><p>A sequência correta é:</p>`,
[`1 – 4 – 2 – 3`,`2 – 3 – 1 – 4`,`3 – 4 – 1 – 2`,`4 – 2 – 3 – 1`,`2 – 4 – 1 – 3`],`E`,
`Eureka (<b>2</b>) = service discovery; Gateway (<b>4</b>) = API gateway; Config (<b>1</b>) = configuração centralizada (ex.: em repositório Git); Resilience4j (<b>3</b>) = <b>circuit breaker</b> (estados: fechado → aberto → semiaberto), retry, rate limiter, bulkhead. O antigo Hystrix/Zuul/Ribbon da Netflix entrou em manutenção e foi substituído por esses.`],

[`es`,`Spring Boot – Configuração`,`<p>Em uma aplicação Spring Boot, para usar configurações diferentes em desenvolvimento e produção (URLs de banco, níveis de log), o recurso nativo mais adequado é:</p>`,
[`criar um projeto separado para cada ambiente.`,`usar profiles (ex.: application-dev.properties e application-prod.properties), ativados por spring.profiles.active.`,`alterar o código-fonte antes de cada deploy.`,`gravar as configurações em constantes Java.`,`usar apenas variáveis de ambiente do sistema operacional, pois o Boot não lê arquivos.`],`B`,
`<b>Profiles</b>: <code>application-{perfil}.properties/.yml</code> + <code>spring.profiles.active</code>; beans condicionais com <b>@Profile</b>. O Boot também lê variáveis de ambiente e argumentos de linha de comando (ordem de precedência externalizada), alinhado ao <b>12-Factor App</b> (config no ambiente). Segredos: nunca no repositório.`],

// ---------- JSF / PRIMEFACES ----------
[`es`,`JSF – Ciclo de vida`,`<p>A ordem correta das fases do ciclo de vida de uma requisição JSF é:</p>`,
[`Restore View → Process Validations → Apply Request Values → Invoke Application → Update Model Values → Render Response`,`Render Response → Restore View → Apply Request Values → Process Validations → Update Model Values → Invoke Application`,`Restore View → Apply Request Values → Process Validations → Update Model Values → Invoke Application → Render Response`,`Apply Request Values → Restore View → Update Model Values → Process Validations → Render Response → Invoke Application`,`Restore View → Update Model Values → Apply Request Values → Process Validations → Invoke Application → Render Response`],`C`,
`1) <b>Restore View</b> (monta/recupera a árvore de componentes) → 2) <b>Apply Request Values</b> (lê valores submetidos) → 3) <b>Process Validations</b> (conversão + validação) → 4) <b>Update Model Values</b> (grava no managed bean) → 5) <b>Invoke Application</b> (executa action/listener) → 6) <b>Render Response</b>. Se a validação falha, pula direto para Render Response. <b>immediate="true"</b> antecipa o processamento para a fase 2.`],

[`es`,`PrimeFaces`,`<p>Em PrimeFaces, no componente <code>&lt;p:commandButton value="Salvar" action="#{servidorBean.salvar}" process="@form" update="tabela msgs"/&gt;</code>, os atributos process e update indicam, respectivamente:</p>`,
[`os componentes a serem processados no servidor na requisição AJAX e os componentes a serem re-renderizados na resposta.`,`o método de persistência e a tabela do banco a ser atualizada.`,`o formulário a ser limpo e o bean a ser destruído.`,`a ordem de validação e o arquivo CSS a ser recarregado.`,`que a requisição será síncrona e que a página inteira será recarregada.`],`A`,
`No PrimeFaces, <b>p:commandButton é AJAX por padrão</b> (ajax="true"). <b>process</b> = o que é executado no servidor (padrão @form no commandButton); <b>update</b> = o que é atualizado na tela. Palavras-chave: @this, @form, @all, @none. O <code>#{...}</code> é Expression Language (EL) ligando a view ao managed bean (ex.: @Named @ViewScoped).`],

// ---------- JAVASCRIPT ----------
[`es`,`JavaScript – Comparação`,`<p>Em JavaScript, as expressões <code>"5" == 5</code> e <code>"5" === 5</code> retornam, respectivamente:</p>`,
[`false e true`,`true e true`,`false e false`,`true e false`,`erro de tipo e false`],`D`,
`<b>==</b> (igualdade abstrata) faz <b>coerção de tipos</b> antes de comparar: "5" vira 5 → true. <b>===</b> (igualdade estrita) compara <b>tipo e valor</b>, sem coerção → string ≠ number → false. Boa prática: sempre ===. Curiosidades cobradas: <code>null == undefined</code> é true; <code>NaN === NaN</code> é false.`],

[`es`,`JavaScript – Escopo`,`<p>Sobre var, let e const em JavaScript, é correto afirmar que:</p>`,
[`const impede qualquer alteração em objetos, inclusive em suas propriedades.`,`var tem escopo de bloco, e let tem escopo de função.`,`let e const têm escopo de bloco; const impede a reatribuição da variável, mas as propriedades de um objeto declarado com const podem ser alteradas.`,`let pode ser redeclarada no mesmo escopo sem erro.`,`variáveis declaradas com const não precisam ser inicializadas.`],`C`,
`<b>var</b>: escopo de <b>função</b>, sofre hoisting (inicializada como undefined), pode ser redeclarada. <b>let/const</b>: escopo de <b>bloco</b>, ficam na “temporal dead zone” até a declaração, não podem ser redeclaradas. <b>const</b> fixa a <b>referência</b>, não o conteúdo: <code>const o = {}; o.x = 1;</code> é válido. Para imutabilidade real: Object.freeze().`],

[`es`,`JavaScript – Event loop`,`<p>Qual a ordem de saída no console?</p><pre><code>console.log("A");
setTimeout(() =&gt; console.log("B"), 0);
Promise.resolve().then(() =&gt; console.log("C"));
console.log("D");</code></pre>`,
[`A, B, C, D`,`A, D, B, C`,`A, C, D, B`,`A, D, C, B`,`D, A, C, B`],`D`,
`1º o código <b>síncrono</b>: A, D. Depois o <b>event loop</b> esvazia a fila de <b>microtarefas</b> (Promises/then, queueMicrotask) → C. Só então pega a próxima <b>macrotarefa</b> (setTimeout, eventos) → B. Mesmo com 0 ms, setTimeout vai para a fila de macrotarefas. <br>💡 <i>Síncrono → microtask (Promise) → macrotask (setTimeout).</i>`],

[`es`,`JavaScript – Assincronismo`,`<p>Sobre async/await em JavaScript, é correto afirmar que:</p>`,
[`uma função async bloqueia a thread principal até terminar.`,`await pode ser usado apenas com funções síncronas.`,`async/await eliminou as Promises da linguagem.`,`erros em funções async não podem ser tratados.`,`uma função declarada com async sempre retorna uma Promise, e await suspende a execução dessa função até a Promise ser resolvida, sem bloquear o event loop.`],`E`,
`async/await é <b>açúcar sintático sobre Promises</b>. Toda função async retorna Promise (se retornar 5, retorna Promise que resolve com 5). Erros são tratados com <b>try/catch</b> (ou .catch()). Para executar em paralelo: <code>await Promise.all([...])</code>.`],

[`es`,`JavaScript – Tipos`,`<p>Em JavaScript, o resultado de <code>typeof null</code> e de <code>[1, 2, 3].map(x =&gt; x * 2)</code> são, respectivamente:</p>`,
[`"object" e [2, 4, 6]`,`"null" e [2, 4, 6]`,`"undefined" e 12`,`"object" e 12`,`"null" e [1, 2, 3]`],`A`,
`<code>typeof null === "object"</code> é um bug histórico da linguagem, mantido por compatibilidade (cai muito!). <b>map</b> retorna um <b>novo array</b> transformado; <b>filter</b> retorna subconjunto; <b>reduce</b> acumula em um único valor (12 seria reduce com soma). Tipos primitivos: string, number, bigint, boolean, undefined, symbol, null.`],

// ---------- MOBILE ----------
[`es`,`Android – Ciclo de vida`,`<p>Em uma Activity Android, quando o usuário abre um diálogo de outro aplicativo que cobre parcialmente a tela (a Activity continua visível, mas perde o foco), o método de ciclo de vida chamado é:</p>`,
[`onCreate()`,`onDestroy()`,`onPause()`,`onRestart()`,`onStart()`],`C`,
`Ciclo: onCreate → onStart (visível) → <b>onResume</b> (em primeiro plano, interativa) → <b>onPause</b> (perde o foco, parcialmente visível) → <b>onStop</b> (não visível) → onDestroy. Voltando de onStop: onRestart → onStart → onResume. Salvar estado leve: onPause/onSaveInstanceState.`],

[`es`,`Mobile – Abordagens`,`<p>Sobre desenvolvimento para dispositivos móveis, assinale a afirmativa correta.</p>`,
[`Kotlin é a linguagem nativa para iOS, e Swift para Android.`,`Aplicações híbridas não podem acessar recursos do dispositivo.`,`Flutter utiliza JavaScript e React Native utiliza Dart.`,`Kotlin (Android) e Swift (iOS) são linguagens recomendadas para desenvolvimento nativo; frameworks multiplataforma como Flutter (Dart) e React Native (JavaScript/TypeScript) permitem compartilhar código entre as plataformas.`,`Aplicativos nativos têm, em geral, desempenho inferior aos baseados em WebView.`],`D`,
`<b>Nativo</b>: Kotlin/Java (Android Studio, Jetpack Compose) e Swift/Objective-C (Xcode, SwiftUI) — melhor desempenho e acesso total à API. <b>Multiplataforma</b>: Flutter (Dart, renderização própria), React Native (JS, componentes nativos), Kotlin Multiplatform. <b>Híbrido</b> (WebView, ex.: Ionic/Cordova/Capacitor) acessa recursos via plugins.`],

[`es`,`PWA`,`<p>Uma Progressive Web App (PWA) pode funcionar offline e ser “instalada” na tela inicial principalmente graças a:</p>`,
[`service workers, que interceptam requisições e gerenciam cache, e ao Web App Manifest.`,`applets Java executados no navegador.`,`cookies de terceiros.`,`compilação obrigatória para código nativo.`,`servidores de aplicação Jakarta EE embutidos no celular.`],`A`,
`PWA = web app com recursos de app: <b>service worker</b> (script em segundo plano: cache offline, push notifications, sincronização em background), <b>manifest.json</b> (nome, ícones, tela inicial) e <b>HTTPS obrigatório</b>. Vantagem: um código, distribuição pela web.`],

// ---------- LOW-CODE ----------
[`es`,`Low-code / No-code`,`<p>Sobre plataformas low-code e no-code, é correto afirmar que:</p>`,
[`eliminam totalmente a necessidade de governança de TI.`,`são incapazes de integrar-se com APIs externas.`,`aceleram a entrega por meio de componentes visuais e modelos prontos, mas trazem riscos como dependência do fornecedor (vendor lock-in) e “shadow IT”, exigindo governança.`,`low-code dispensa qualquer linha de código em qualquer cenário.`,`são adequadas apenas para sistemas de missão crítica com alto volume.`],`C`,
`<b>No-code</b>: usuários de negócio (<i>citizen developers</i>) montam soluções sem programar. <b>Low-code</b>: desenvolvimento visual com possibilidade de <b>estender com código</b> (D falsa). Riscos: <b>lock-in</b>, shadow IT (soluções fora do controle da TI), limites de escalabilidade/customização, segurança e LGPD. Exemplos: OutSystems, Mendix, Power Apps.`],

[`es`,`Low-code – Aplicação`,`<p>Um órgão precisa, em poucas semanas, de um aplicativo interno simples de solicitação e aprovação de férias, com formulários e fluxo de aprovação. A abordagem que tende a oferecer menor tempo de entrega é:</p>`,
[`desenvolver um sistema distribuído com microsserviços e Kafka.`,`reescrever o ERP da organização.`,`desenvolver um app nativo separado para Android e iOS.`,`criar um monólito em COBOL no mainframe.`,`utilizar uma plataforma low-code com formulários e workflow prontos, observadas as políticas de governança.`],`E`,
`Casos típicos de low-code: <b>formulários, workflows de aprovação, apps departamentais, protótipos</b> — baixa complexidade e necessidade de rapidez. Arquiteturas complexas (A) seriam superdimensionadas para o problema.`],

// ---------- SONARQUBE / CLEAN CODE ----------
[`es`,`SonarQube – Quality Gate`,`<p>No SonarQube, o Quality Gate é:</p>`,
[`o conjunto de regras de linguagem aplicadas na análise.`,`um conjunto de condições (ex.: cobertura mínima em código novo, nenhuma vulnerabilidade nova) que determina se o projeto está apto a ser liberado.`,`o servidor de banco de dados usado pelo SonarQube.`,`o plugin que executa testes de carga.`,`a ferramenta de deploy integrada.`],`B`,
`<b>Quality Profile</b> = conjunto de <b>regras</b> por linguagem (A). <b>Quality Gate</b> = <b>condições de aprovação</b> (passa/falha), que podem quebrar o pipeline de CI. O padrão “Sonar way” foca no <b>código novo</b> (“Clean as You Code”). Métricas: Reliability (bugs), Security (vulnerabilidades), Security Review (hotspots), Maintainability (code smells, dívida técnica), Coverage, Duplications.`],

[`es`,`SonarQube – Classificação`,`<p>No SonarQube, um trecho de código sensível à segurança que <b>precisa de revisão humana</b> para confirmar se existe ou não risco (ex.: uso de função criptográfica ou configuração de CORS) é classificado como:</p>`,
[`Bug`,`Code smell`,`Security hotspot`,`Duplicated block`,`Technical debt ratio`],`C`,
`<b>Vulnerabilidade</b>: problema de segurança confirmado, exige correção. <b>Security hotspot</b>: código sensível que <b>requer revisão</b> — o desenvolvedor avalia se é seguro. <b>Bug</b>: erro que provavelmente causará comportamento incorreto. <b>Code smell</b>: problema de manutenibilidade (método longo, complexidade cognitiva alta, código duplicado).`],

[`es`,`Clean Code`,`<p>Um desenvolvedor percebe a mesma regra de cálculo de desconto copiada em cinco classes diferentes. O princípio violado e a ação recomendada são:</p>`,
[`KISS; adicionar comentários em cada cópia.`,`YAGNI; criar uma interface para cada classe.`,`Lei de Demeter; tornar os métodos estáticos.`,`DRY; extrair a regra para um único local reutilizável.`,`SRP; duplicar os testes.`],`D`,
`<b>DRY</b> (Don’t Repeat Yourself): cada conhecimento deve ter uma representação única. Duplicação multiplica pontos de manutenção e bugs. Outros: <b>KISS</b> (mantenha simples), <b>YAGNI</b> (não implemente o que não precisa agora), <b>Lei de Demeter</b> (fale só com “amigos” imediatos, evite a.getB().getC().faz()). O SonarQube aponta duplicação como métrica própria.`],

// ---------- ARQUITETURA / INTEROPERABILIDADE / SERVIDORES ----------
[`es`,`SOAP × REST`,`<p>Sobre interoperabilidade com web services, é correto afirmar que:</p>`,
[`REST é um protocolo que exige XML e WSDL.`,`SOAP é um protocolo baseado em XML, com contrato descrito em WSDL e padrões como WS-Security; REST é um estilo arquitetural que usa os métodos HTTP sobre recursos, frequentemente com JSON.`,`SOAP não pode ser transportado sobre HTTP.`,`REST exige manter o estado da sessão do cliente no servidor.`,`SOAP e REST são incompatíveis com o uso de TLS.`],`B`,
`<b>SOAP</b>: protocolo, envelope XML (Envelope/Header/Body), contrato <b>WSDL</b>, extensões WS-* (Security, ReliableMessaging). Em Java: <b>JAX-WS</b>. <b>REST</b>: estilo arquitetural (Roy Fielding), recursos identificados por URI, representações (JSON, XML), <b>stateless</b>. Em Java: <b>JAX-RS</b> (Jakarta RESTful Web Services) ou Spring MVC.`],

[`es`,`REST – Restrições`,`<p>Entre as restrições arquiteturais do estilo REST definidas por Roy Fielding, NÃO se inclui:</p>`,
[`cliente-servidor`,`comunicação sem estado (stateless)`,`interface uniforme`,`sistema em camadas`,`obrigatoriedade de sessão persistente no servidor para cada cliente`],`E`,
`Restrições REST: <b>cliente-servidor</b>, <b>stateless</b> (cada requisição traz tudo o que é necessário), <b>cacheável</b>, <b>interface uniforme</b> (identificação de recursos, manipulação via representações, mensagens autodescritivas, <b>HATEOAS</b>), <b>sistema em camadas</b> e <b>código sob demanda</b> (única opcional). Sessão no servidor viola o stateless. Nível 3 do modelo de maturidade de Richardson = HATEOAS.`],

[`es`,`Servidores de aplicação`,`<p>Sobre servidores e contêineres Java, é correto afirmar que:</p>`,
[`o Apache Tomcat é essencialmente um contêiner web (Servlets/JSP), enquanto servidores como WildFly, Payara/GlassFish e WebLogic implementam o perfil completo do Jakarta EE (EJB, JMS, JTA etc.).`,`o Tomcat implementa integralmente EJB e JMS.`,`servidores de aplicação não podem executar aplicações web.`,`o Spring Boot não permite servidor embutido.`,`o WildFly é um banco de dados NoSQL.`],`A`,
`<b>Servlet container</b> (Tomcat, Jetty, Undertow): Servlets, JSP, WebSocket. <b>Servidor de aplicação</b> completo (WildFly/JBoss EAP, Payara/GlassFish, WebLogic, WebSphere/Open Liberty): EJB, JMS, JTA, CDI, JPA gerenciado. O Spring Boot empacota um contêiner <b>embutido</b> (Tomcat por padrão) no JAR executável. Empacotamentos: JAR, <b>WAR</b> (web), <b>EAR</b> (enterprise).`],

[`es`,`Microsserviços – Saga`,`<p>Em uma arquitetura de microsserviços com um banco de dados por serviço, para manter a consistência de um processo de negócio que envolve vários serviços (ex.: pedido, pagamento e estoque) sem usar transação distribuída 2PC, utiliza-se o padrão:</p>`,
[`Singleton`,`Active Record`,`Saga, com transações locais e ações compensatórias`,`Front Controller`,`Table Data Gateway`],`C`,
`<b>Saga</b>: sequência de transações locais; se uma etapa falha, executam-se <b>transações compensatórias</b> (ex.: estornar o pagamento). Estilos: <b>coreografia</b> (serviços reagem a eventos) ou <b>orquestração</b> (um orquestrador comanda). Resultado: <b>consistência eventual</b> (BASE), em vez de ACID global. Padrões relacionados: Outbox, CQRS, Event Sourcing.`],

[`es`,`GraphQL`,`<p>Uma das características do GraphQL em comparação com APIs REST tradicionais é:</p>`,
[`exigir um endpoint diferente para cada campo retornado.`,`não possuir esquema tipado.`,`funcionar apenas com XML.`,`permitir que o cliente especifique exatamente os campos de que precisa, geralmente por um único endpoint, reduzindo over-fetching e under-fetching.`,`impedir operações de escrita.`],`D`,
`GraphQL: <b>esquema fortemente tipado</b>, operações <b>query</b> (leitura), <b>mutation</b> (escrita) e <b>subscription</b> (tempo real), normalmente em um único endpoint (/graphql). Evita <b>over-fetching</b> (dados demais) e <b>under-fetching</b> (várias chamadas). Contraponto: cache HTTP mais difícil e risco de consultas muito custosas (limitar profundidade/complexidade).`],

// ---------- TESTES ----------
[`es`,`Testes – Valor-limite`,`<p>Um campo aceita idades de 18 a 60 anos (inclusive). Aplicando a técnica de análise de valor-limite, o conjunto de valores mais adequado para testar é:</p>`,
[`17, 18, 60 e 61`,`20, 30, 40 e 50`,`0, 100 e 1000`,`18 e 60 apenas`,`19, 35 e 59`],`A`,
`<b>Valor-limite</b> (caixa-preta): erros se concentram nas <b>fronteiras</b> — testar o limite e o valor imediatamente fora (17/18 e 60/61; às vezes também 19 e 59). <b>Particionamento de equivalência</b>: dividir em classes (&lt;18 inválida; 18–60 válida; &gt;60 inválida) e testar um representante de cada. Caixa-branca: cobertura de comandos, decisões, caminhos (baseada no código).`],

[`es`,`JUnit 5 e Mockito`,`<p>Analise as afirmativas sobre JUnit 5 e Mockito.</p><p>I. @BeforeEach executa antes de cada método de teste; @BeforeAll executa uma única vez antes de todos (em geral em método static).</p><p>II. assertThrows permite verificar se um trecho de código lança determinada exceção.</p><p>III. No Mockito, verify() é usado para conferir se um método do mock foi chamado, e when(...).thenReturn(...) define o comportamento simulado.</p><p>Está correto o que se afirma em:</p>`,
[`I, apenas`,`II, apenas`,`I e II, apenas`,`II e III, apenas`,`I, II e III`],`E`,
`Todas corretas. JUnit 5 (Jupiter): @Test, @BeforeEach/@AfterEach, @BeforeAll/@AfterAll, @DisplayName, @Disabled, <b>@ParameterizedTest</b>, assertEquals, assertTrue, assertThrows, assertAll. (No JUnit 4: @Before/@BeforeClass.) Mockito: <b>@Mock</b>, <b>@InjectMocks</b>, when/thenReturn (stub), <b>verify</b> (verificação de interação). <b>Mock</b> verifica interações; <b>stub</b> só fornece respostas prontas.`],

[`es`,`Testes – Estratégia`,`<p>Sobre a pirâmide de testes e testes de regressão, é correto afirmar que:</p>`,
[`a base da pirâmide deve ter a maior quantidade de testes de interface (E2E), por serem mais rápidos.`,`a pirâmide recomenda muitos testes unitários (rápidos e baratos), menos testes de integração e poucos testes end-to-end; testes de regressão verificam se alterações não quebraram funcionalidades existentes.`,`testes de regressão só são executados na primeira versão do sistema.`,`testes unitários devem acessar banco de dados real e rede.`,`a automação de testes torna desnecessária a execução de regressão.`],`B`,
`Pirâmide (Mike Cohn): <b>base</b> = unitários (muitos, rápidos), <b>meio</b> = integração/serviço, <b>topo</b> = E2E/UI (poucos, lentos, frágeis). <b>Regressão</b>: reexecutar testes após mudanças — é exatamente onde a automação mais compensa. <b>Smoke test</b>: verificação rápida de que o básico funciona após o deploy.`],

[`es`,`Testes de usabilidade`,`<p>Sobre testes de usabilidade de software, é correto afirmar que:</p>`,
[`devem ser feitos exclusivamente por meio de ferramentas automáticas de análise de código.`,`medem apenas o tempo de resposta do servidor.`,`dispensam a participação de usuários.`,`são realizados apenas após a implantação em produção.`,`envolvem observar usuários representativos executando tarefas reais, avaliando eficácia, eficiência e satisfação; avaliações heurísticas (como as 10 heurísticas de Nielsen) complementam esses testes.`],`E`,
`Usabilidade (ISO 9241-11): <b>eficácia</b>, <b>eficiência</b> e <b>satisfação</b> em um contexto de uso. Técnicas: teste com usuários (pensar em voz alta), <b>avaliação heurística</b> por especialistas (Nielsen: visibilidade do status, correspondência com o mundo real, controle e liberdade, consistência, prevenção de erros, reconhecimento em vez de memorização…), testes A/B. Acessibilidade no governo: eMAG/WCAG.`],

// ---------- ÁGEIS ----------
[`es`,`Kanban`,`<p>No método Kanban aplicado ao desenvolvimento de software, a prática de limitar o trabalho em progresso (WIP) tem como principal objetivo:</p>`,
[`aumentar o número de tarefas iniciadas simultaneamente.`,`substituir o Product Owner.`,`definir sprints de duração fixa.`,`melhorar o fluxo, reduzir o lead time e expor gargalos, estabelecendo um sistema puxado.`,`eliminar a necessidade de visualização do trabalho.`],`D`,
`Kanban: <b>visualizar o fluxo</b> (quadro), <b>limitar o WIP</b>, <b>gerenciar o fluxo</b>, explicitar políticas, ciclos de feedback e melhoria colaborativa. Sistema <b>puxado</b>: só se puxa novo item quando há capacidade. Métricas: <b>lead time</b> (do pedido à entrega), <b>cycle time</b> (do início do trabalho à entrega), throughput, diagrama de fluxo cumulativo (CFD). Kanban <b>não</b> prescreve sprints nem papéis.`],

[`es`,`XP – Extreme Programming`,`<p>São práticas da Extreme Programming (XP):</p>`,
[`programação em pares, TDD, integração contínua, refatoração e pequenas liberações (small releases).`,`Sprint Review, Daily Scrum e Sprint Retrospective.`,`Estrutura Analítica do Projeto (EAP) e Gráfico de Gantt como artefatos centrais.`,`documentação extensa aprovada antes de qualquer codificação.`,`limite de WIP e diagrama de fluxo cumulativo como práticas exclusivas.`],`A`,
`XP (Kent Beck) — <b>valores</b>: comunicação, simplicidade, feedback, coragem e respeito. <b>Práticas</b>: pair programming, TDD, CI, refatoração, small releases, design simples, propriedade coletiva do código, padrões de codificação, ritmo sustentável (40h), cliente presente, jogo do planejamento, metáfora. B = eventos do Scrum; E = Kanban; C/D = abordagem tradicional (preditiva).`],

[`es`,`Scrum`,`<p>De acordo com o Guia do Scrum (2020), é correto afirmar que:</p>`,
[`o Scrum Master é o único responsável por maximizar o valor do produto.`,`a Sprint tem duração máxima de um mês, e apenas o Product Owner tem autoridade para cancelá-la.`,`a Daily Scrum tem duração de 1 hora para Sprints de um mês.`,`o Time Scrum é formado por gerente de projeto, analistas e testadores.`,`o Product Backlog é imutável durante a Sprint.`],`B`,
`Sprint: até <b>1 mês</b>; só o <b>PO</b> pode cancelá-la (se a Meta da Sprint ficar obsoleta). <b>Daily</b>: 15 min. Responsabilidades: <b>Product Owner</b> (maximizar valor, gerir o Product Backlog), <b>Scrum Master</b> (eficácia do time, remover impedimentos) e <b>Developers</b>. O guia 2020 não fala mais em “papéis”, e sim em “accountabilities”, e aboliu o termo “Time de Desenvolvimento”. O Product Backlog é refinado continuamente.`],

// ---------- SEGURANÇA – SDL / OWASP ----------
[`es`,`OWASP Top 10`,`<p>Um usuário autenticado altera, na URL, o parâmetro <code>/api/beneficios/1001</code> para <code>/api/beneficios/1002</code> e consegue visualizar dados de outro beneficiário. Segundo a OWASP Top 10 (2021), essa falha (IDOR) enquadra-se na categoria:</p>`,
[`A03 – Injection`,`A06 – Vulnerable and Outdated Components`,`A09 – Security Logging and Monitoring Failures`,`A02 – Cryptographic Failures`,`A01 – Broken Access Control`],`E`,
`<b>IDOR</b> (Insecure Direct Object Reference) = falha de <b>controle de acesso</b>: o servidor não verifica se o objeto pertence ao usuário. <b>A01:2021 – Broken Access Control</b> subiu para o 1º lugar. Correção: validar a autorização no servidor a cada acesso, negar por padrão. Top 10 2021: A01 Broken Access Control, A02 Cryptographic Failures, A03 Injection (inclui XSS), A04 Insecure Design, A05 Security Misconfiguration, A06 Vulnerable Components, A07 Identification and Authentication Failures, A08 Software and Data Integrity Failures, A09 Logging and Monitoring Failures, A10 SSRF.`],

[`es`,`OWASP – SSRF`,`<p>Uma aplicação recebe uma URL informada pelo usuário e faz o próprio servidor buscar o conteúdo, permitindo que um atacante acesse serviços internos da rede (ex.: http://169.254.169.254/). Essa vulnerabilidade é:</p>`,
[`Cross-Site Request Forgery (CSRF)`,`Server-Side Request Forgery (SSRF)`,`Clickjacking`,`SQL Injection`,`Path Traversal em arquivo local`],`B`,
`<b>SSRF</b> (A10:2021): o servidor é induzido a fazer requisições a destinos escolhidos pelo atacante, incluindo endpoints internos e metadados de nuvem. Defesas: <b>allowlist</b> de destinos, bloquear IPs internos, segmentar rede. <b>CSRF</b> é diferente: o <b>navegador da vítima</b> envia uma requisição não intencional a um site em que ela está autenticada.`],

[`es`,`SDL – Ciclo de vida seguro`,`<p>No Security Development Lifecycle (SDL), a modelagem de ameaças (threat modeling), frequentemente apoiada pela metodologia STRIDE, é realizada principalmente na fase de:</p>`,
[`Resposta a incidentes`,`Liberação (Release)`,`Projeto (Design)`,`Treinamento`,`Verificação dinâmica em produção`],`C`,
`SDL (Microsoft): <b>Treinamento</b> → <b>Requisitos</b> (requisitos de segurança e privacidade, “bug bars”) → <b>Projeto</b> (<b>modelagem de ameaças</b>, redução da superfície de ataque) → <b>Implementação</b> (ferramentas aprovadas, funções inseguras banidas, análise estática) → <b>Verificação</b> (análise dinâmica, fuzzing) → <b>Liberação</b> (plano de resposta, revisão final) → <b>Resposta</b>. Quanto mais cedo a falha é achada, mais barato corrigir (shift left).`],

[`es`,`STRIDE`,`<p>Na metodologia STRIDE de modelagem de ameaças, a ameaça de <b>Tampering</b> (adulteração) viola principalmente a propriedade de:</p>`,
[`disponibilidade`,`autenticidade`,`não repúdio`,`integridade`,`autorização`],`D`,
`STRIDE × propriedade violada: <b>S</b>poofing → autenticidade (autenticação); <b>T</b>ampering → <b>integridade</b>; <b>R</b>epudiation → não repúdio; <b>I</b>nformation disclosure → confidencialidade; <b>D</b>enial of service → disponibilidade; <b>E</b>levation of privilege → autorização.`],

[`es`,`CSRF`,`<p>Uma medida eficaz para mitigar ataques de Cross-Site Request Forgery (CSRF) em aplicações web baseadas em sessão por cookie é:</p>`,
[`utilizar tokens anti-CSRF imprevisíveis vinculados à sessão e configurar cookies com o atributo SameSite.`,`armazenar senhas com MD5.`,`desabilitar o HTTPS.`,`aumentar o tempo de expiração da sessão.`,`usar apenas requisições GET para alterar dados.`],`A`,
`CSRF explora o envio automático de cookies pelo navegador. Defesas: <b>token sincronizador</b> (anti-CSRF) em formulários, cookies <b>SameSite=Lax/Strict</b>, verificação de Origin/Referer, reautenticação em ações críticas. Nunca use GET para alterar estado (E piora). O Spring Security habilita proteção CSRF por padrão.`],

// ---------- BANCO DE DADOS ----------
[`es`,`Normalização`,`<p>Uma tabela ITEM_PEDIDO(<u>num_pedido</u>, <u>cod_produto</u>, quantidade, nome_produto) tem chave primária composta. O atributo nome_produto depende apenas de cod_produto. Essa situação viola a:</p>`,
[`1ª Forma Normal, pois há atributos multivalorados.`,`2ª Forma Normal, pois há dependência funcional parcial da chave.`,`3ª Forma Normal, pois há dependência transitiva entre atributos não chave.`,`Forma Normal de Boyce-Codd, apenas.`,`4ª Forma Normal, pois há dependência multivalorada.`],`B`,
`<b>1FN</b>: atributos atômicos, sem grupos repetidos. <b>2FN</b>: 1FN + <b>nenhuma dependência parcial</b> de chave composta (nome_produto depende só de parte da chave → mover para PRODUTO). <b>3FN</b>: 2FN + <b>sem dependência transitiva</b> (atributo não chave dependendo de outro não chave, ex.: cep → cidade). <b>FNBC</b>: todo determinante é chave candidata. <br>💡 <i>Chave composta + atributo que depende de só uma parte = 2FN.</i>`],

[`es`,`SQL – Agrupamento`,`<p>Considere a consulta:</p><pre><code>SELECT lotacao, COUNT(*) AS total
FROM servidor
WHERE ativo = 'S'
GROUP BY lotacao
HAVING COUNT(*) &gt; 10
ORDER BY total DESC;</code></pre><p>É correto afirmar que ela:</p>`,
[`filtra as lotações com mais de 10 servidores antes de aplicar o WHERE.`,`gera erro, pois HAVING não pode ser usado com COUNT.`,`retorna todas as lotações, inclusive as com menos de 10 servidores ativos.`,`retorna as lotações com mais de 10 servidores ativos, ordenadas da maior para a menor quantidade.`,`ordena as lotações em ordem alfabética.`],`D`,
`Ordem lógica de execução: <b>FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY</b>. WHERE filtra <b>linhas</b> (antes de agrupar); HAVING filtra <b>grupos</b> (após agregar). Por isso funções de agregação (COUNT, SUM, AVG) vão no HAVING, não no WHERE.`],

[`es`,`SQL – Junções`,`<p>Dadas as tabelas SERVIDOR (100 linhas) e DEPENDENTE, em que 30 servidores não possuem dependentes, a consulta <code>SELECT s.nome, d.nome FROM servidor s LEFT JOIN dependente d ON d.id_servidor = s.id</code>:</p>`,
[`retorna apenas os servidores que possuem dependentes.`,`retorna o produto cartesiano entre as tabelas.`,`retorna todos os servidores; para os que não têm dependentes, as colunas de DEPENDENTE vêm com NULL.`,`retorna apenas os dependentes sem servidor.`,`gera erro, pois LEFT JOIN exige cláusula WHERE.`],`C`,
`<b>INNER JOIN</b>: só as correspondências. <b>LEFT JOIN</b>: todas as linhas da tabela da <b>esquerda</b> + correspondências (ou NULL). <b>RIGHT JOIN</b>: o inverso. <b>FULL OUTER JOIN</b>: todas de ambas. <b>CROSS JOIN</b>: produto cartesiano. Para achar servidores <b>sem</b> dependentes: LEFT JOIN … WHERE d.id IS NULL.`],

[`es`,`DDL / DML / DCL`,`<p>Assinale a opção que classifica corretamente os comandos SQL.</p>`,
[`CREATE, ALTER, DROP e TRUNCATE são DDL; INSERT, UPDATE, DELETE e SELECT são DML; GRANT e REVOKE são DCL; COMMIT e ROLLBACK são de controle de transação (TCL).`,`INSERT e UPDATE são DDL; CREATE é DML.`,`GRANT é DML, e DELETE é DCL.`,`TRUNCATE é DML e pode ser sempre desfeito com ROLLBACK em qualquer SGBD.`,`SELECT é DDL.`],`A`,
`<b>DDL</b> (definição): CREATE, ALTER, DROP, TRUNCATE, RENAME. <b>DML</b> (manipulação): SELECT (às vezes separado como DQL), INSERT, UPDATE, DELETE, MERGE. <b>DCL</b> (controle de acesso): GRANT, REVOKE. <b>TCL</b>: COMMIT, ROLLBACK, SAVEPOINT. <b>DELETE × TRUNCATE</b>: DELETE remove linha a linha, aceita WHERE e dispara triggers; TRUNCATE esvazia a tabela inteira, é DDL e, em muitos SGBDs (ex.: Oracle), faz commit implícito.`],

[`es`,`Transações – Isolamento`,`<p>Uma transação lê dados alterados por outra transação que ainda não fez commit, e essa outra transação depois faz rollback. Essa anomalia e o nível de isolamento mínimo que a evita são:</p>`,
[`leitura fantasma; READ UNCOMMITTED`,`leitura não repetível; READ UNCOMMITTED`,`deadlock; SERIALIZABLE`,`atualização perdida; READ COMMITTED`,`leitura suja (dirty read); READ COMMITTED`],`E`,
`Níveis ANSI × anomalias evitadas: <b>READ UNCOMMITTED</b> (nenhuma); <b>READ COMMITTED</b> (evita dirty read); <b>REPEATABLE READ</b> (evita também non-repeatable read); <b>SERIALIZABLE</b> (evita também phantom read). <b>Non-repeatable read</b>: reler a mesma linha e ela mudou. <b>Phantom</b>: reexecutar a consulta e aparecerem/sumirem linhas.`],

[`es`,`NoSQL`,`<p>Associe o tipo de banco NoSQL ao exemplo mais representativo:</p><p>(1) Chave-valor &nbsp; (2) Documento &nbsp; (3) Colunar (wide-column) &nbsp; (4) Grafo</p><p>( ) Neo4j &nbsp; ( ) MongoDB &nbsp; ( ) Redis &nbsp; ( ) Cassandra</p><p>A sequência correta é:</p>`,
[`4 – 2 – 1 – 3`,`2 – 4 – 3 – 1`,`1 – 2 – 4 – 3`,`4 – 1 – 2 – 3`,`3 – 2 – 1 – 4`],`A`,
`<b>Neo4j</b> = grafo (4: nós e arestas, ideal para relacionamentos, ex.: detecção de fraude); <b>MongoDB</b> = documento (2: JSON/BSON); <b>Redis</b> = chave-valor (1: em memória, cache, sessões); <b>Cassandra</b> = colunar/wide-column (3: alta escrita distribuída). <b>Teorema CAP</b>: em partição de rede, escolhe-se entre Consistência e Disponibilidade. NoSQL costuma seguir <b>BASE</b> (consistência eventual).`],

[`es`,`ETL × ELT`,`<p>Sobre técnicas de integração e ingestão de dados, é correto afirmar que:</p>`,
[`no ETL, os dados são carregados brutos no destino e só depois transformados.`,`no ELT, os dados são extraídos e carregados no destino (ex.: data lake ou data warehouse em nuvem) e a transformação ocorre dentro dele, aproveitando seu poder de processamento.`,`ETL e ELT são técnicas exclusivas de bancos NoSQL.`,`integração via base de dados compartilhada elimina o acoplamento entre sistemas.`,`transferência de arquivos é incompatível com processamento em lote.`],`B`,
`<b>ETL</b>: Extract → <b>Transform</b> (em servidor intermediário/staging) → Load — clássico em DW tradicional. <b>ELT</b>: Extract → Load → <b>Transform no destino</b> — comum com data lakes e DW em nuvem. Integração por <b>banco compartilhado</b> é simples, mas gera <b>alto acoplamento</b>. <b>Transferência de arquivos</b> (CSV, SFTP) é típica de processamento <b>em lote (batch)</b>.`],

// ---------- GESTÃO E GOVERNANÇA ----------
[`es`,`PMBOK 7`,`<p>Sobre a 7ª edição do Guia PMBOK, é correto afirmar que:</p>`,
[`organiza-se em 49 processos distribuídos em 5 grupos e 10 áreas de conhecimento, obrigatoriamente.`,`aplica-se apenas a projetos com abordagem preditiva (cascata).`,`adota uma abordagem baseada em princípios, com 12 princípios de gerenciamento de projetos e 8 domínios de desempenho, voltada à entrega de valor e aplicável a abordagens preditivas, adaptativas e híbridas.`,`eliminou o conceito de partes interessadas.`,`substituiu o gerente de projetos pelo Scrum Master.`],`C`,
`O PMBOK 6 era <b>baseado em processos</b> (49 processos, 5 grupos, 10 áreas). O <b>PMBOK 7 (2021)</b> é baseado em <b>princípios</b> e no <b>sistema de entrega de valor</b>: 12 princípios (ex.: administração, equipe, partes interessadas, valor, pensamento sistêmico, liderança, adaptação, qualidade, complexidade, risco, adaptabilidade/resiliência, mudança) e <b>8 domínios de desempenho</b>: partes interessadas, equipe, abordagem de desenvolvimento e ciclo de vida, planejamento, trabalho do projeto, entrega, medição e incerteza.`],

[`es`,`BPMN`,`<p>Em um diagrama BPMN, um losango contendo um “X”, a partir do qual apenas um dos caminhos de saída é seguido conforme uma condição, representa um:</p>`,
[`gateway paralelo`,`evento intermediário de tempo`,`subprocesso`,`gateway exclusivo (XOR)`,`objeto de dados`],`D`,
`Gateways (losangos): <b>exclusivo</b> (X ou vazio) → só um caminho; <b>paralelo</b> (+) → todos os caminhos simultaneamente (e sincroniza na junção); <b>inclusivo</b> (O) → um ou mais caminhos; <b>baseado em eventos</b> (pentágono) → o primeiro evento que ocorrer. Eventos = círculos (início: borda fina; intermediário: borda dupla; fim: borda grossa). <b>Pool</b> = participante; <b>lane</b> = papel/área dentro dele. Fluxo de sequência (linha cheia) × fluxo de mensagem (tracejada, entre pools).`],

[`es`,`ITIL 4 e COBIT 2019`,`<p>Analise as afirmativas.</p><p>I. No ITIL 4, o Sistema de Valor de Serviço (SVS) inclui a cadeia de valor de serviço, as práticas, os princípios orientadores, a governança e a melhoria contínua.</p><p>II. O COBIT 2019 distingue governança (domínio EDM – Avaliar, Dirigir e Monitorar) de gestão (domínios APO, BAI, DSS e MEA).</p><p>III. “Foco no valor” e “Começar de onde você está” são princípios orientadores do ITIL 4.</p><p>Está correto o que se afirma em:</p>`,
[`I, apenas`,`II, apenas`,`I e III, apenas`,`II e III, apenas`,`I, II e III`],`E`,
`Todas corretas. <b>ITIL 4</b>: SVS = princípios orientadores + governança + <b>cadeia de valor</b> (planejar, melhorar, engajar, design e transição, obter/construir, entregar e suportar) + <b>34 práticas</b> + melhoria contínua. 7 princípios: foco no valor; começar de onde você está; progredir iterativamente com feedback; colaborar e promover visibilidade; pensar e trabalhar de forma holística; manter simples e prático; otimizar e automatizar. <b>COBIT 2019</b>: 40 objetivos; governança = <b>EDM</b> (conselho); gestão = <b>APO</b>, <b>BAI</b>, <b>DSS</b>, <b>MEA</b>.`],
];

const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };

function header(title,sub,timer){
  $('#htitle').textContent=title; $('#hsub').textContent=sub||'Analista de TI – Perfil 3: Desenvolvimento de Software · padrão FGV';
  $('#timer').classList.toggle('hide',!timer); $('#homeBtn').classList.toggle('hide',!S);
}
function stopTimer(){ if(tInt){clearInterval(tInt);tInt=null} }
function goHome(){
  if(S && S.mode!=='review' && !S.done && !confirm('Sair agora? O progresso desta sessão será perdido.')) return;
  stopTimer(); S=null; home();
}

function resetStats(){ if(confirm('Apagar todas as estatísticas e o histórico?')){stats={};hist=[];LS.set('stats',stats);LS.set('hist',hist);home();} }

// ================== PROVA (modo exame) ==================
function sortearProva(){
  return ORDER.flatMap(d=>shuffle(BANK.filter(q=>q.d===d)).slice(0,DIST[d]));
}
function startExam(k){
  const qs = k==='rand' ? sortearProva() : PROVAS[k].qs;
  const nome = k==='rand' ? 'Prova sorteada' : PROVAS[k].nome;
  S = {mode:'exam', nome, qs, ans:{}, cut:{}, mark:{}, i:0, start:Date.now(), limit:4*3600, done:false};
  header(nome,'70 questões · 4 horas · correção ao final',true);
  stopTimer();
  tInt = setInterval(()=>{
    const rest = S.limit - (Date.now()-S.start)/1000;
    const el=$('#timer'); el.textContent=fmt(rest); el.classList.toggle('low',rest<900);
    if(rest<=0){ stopTimer(); alert('Tempo esgotado! Sua prova será corrigida agora.'); finishExam(true); }
  },1000);
  $('#timer').textContent='04:00:00';
  renderExam();
}
function optHTML(q,st,locked){
  return q.o.map((t,i)=>{
    const l=L[i]; let cls='opt';
    const chosen = st.ans[q.id]===l;
    if(chosen) cls+=' sel';
    if(st.cut[q.id+l]) cls+=' cut';
    if(locked){ cls+=' lock'; if(l===q.g) cls+=' right'; else if(chosen) cls+=' wrong'; }
    return `<div class="${cls}" ${locked?'':`onclick="choose(${q.id},'${l}')"`}><span class="l">${l})</span><span class="t">${t}</span>${locked?'':`<button class="cutb" title="Riscar alternativa (eliminação)" onclick="event.stopPropagation();cutOpt(${q.id},'${l}')">✂</button>`}</div>`;
  }).join('');
}
function modLabel(q){ return q.d==='es'?'Módulo II':'Módulo I'; }
function renderExam(){
  const q=S.qs[S.i], n=S.i+1, tot=S.qs.length;
  const answered=Object.keys(S.ans).length;
  app.innerHTML = `
  <div class="q">
    <div class="qhead"><span class="qnum">Questão ${n} de ${tot}</span><span class="qdisc">${modLabel(q)} · ${DSHORT[q.d]} · peso ${PESO(q.d)}</span></div>
    <div class="enun">${q.e}</div>
    <div>${optHTML(q,S,false)}</div>
    <div class="nav">
      <button class="btn sec" ${S.i?'':'disabled style="opacity:.4"'} onclick="go(${S.i-1})">← Anterior</button>
      <button class="btn sec mark-btn ${S.mark[q.id]?'on':''}" onclick="toggleMark(${q.id})">${S.mark[q.id]?'★ Marcada p/ revisar':'☆ Marcar p/ revisar'}</button>
      ${S.i<tot-1?`<button class="btn" onclick="go(${S.i+1})">Próxima →</button>`:`<button class="btn danger" onclick="finishExam()">Entregar prova</button>`}
    </div>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between"><b>Cartão-resposta</b><span class="muted">${answered}/${tot} respondidas · ★ = marcada</span></div>
    <div class="bar" style="margin:.4rem 0"><i style="width:${answered/tot*100}%"></i></div>
    <div class="cartao">${S.qs.map((qq,i)=>{
      const sep = (i===0||S.qs[i-1].d!==qq.d)?`<div class="mod">${DSHORT[qq.d]}</div>`:'';
      return sep+`<button class="${S.ans[qq.id]?'ans':''} ${S.mark[qq.id]?'mark':''} ${i===S.i?'cur':''}" onclick="go(${i})">${i+1}${S.ans[qq.id]?'·'+S.ans[qq.id]:''}</button>`;}).join('')}</div>
    <div class="row" style="justify-content:flex-end"><button class="btn danger" onclick="finishExam()">Entregar prova</button></div>
  </div>`;
}
function go(i){ S.i=i; renderExam(); window.scrollTo(0,0); }
function choose(id,l){ if(S.ans[id]===l) delete S.ans[id]; else S.ans[id]=l; S.cut[id+l]=false; S.mode==='exam'?renderExam():null; }
function cutOpt(id,l){ S.cut[id+l]=!S.cut[id+l]; if(S.cut[id+l]&&S.ans[id]===l) delete S.ans[id]; renderExam(); }
function toggleMark(id){ S.mark[id]=!S.mark[id]; renderExam(); }

function finishExam(auto){
  const tot=S.qs.length, blank=tot-Object.keys(S.ans).length, marks=Object.values(S.mark).filter(Boolean).length;
  if(!auto){
    let msg='Entregar a prova agora?';
    if(blank) msg+=`\n\n⚠ ${blank} questão(ões) em branco (valem zero — na prova real, chute!).`;
    if(marks) msg+=`\n★ ${marks} marcada(s) para revisar.`;
    if(!confirm(msg)) return;
  }
  stopTimer(); S.done=true; S.elapsed=Math.min(S.limit,(Date.now()-S.start)/1000);
  const res = corrigir(S.qs,S.ans);
  S.qs.forEach(q=>{ if(S.ans[q.id]) record(q,S.ans[q.id]===q.g); else record(q,false); });
  hist.push({data:new Date().toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}),nome:S.nome,nota:res.nota,acertos:res.acertos,tempo:fmt(S.elapsed)});
  LS.set('hist',hist);
  S.res=res; S.filter='todas';
  renderResult();
}
function corrigir(qs,ans){
  const pd={}; ORDER.forEach(d=>pd[d]={c:0,t:0,pts:0,max:0});
  let acertos=0,nota=0; const temas={};
  qs.forEach(q=>{ const p=pd[q.d]; p.t++; p.max+=PESO(q.d);
    if(ans[q.id]===q.g){acertos++;nota+=PESO(q.d);p.c++;p.pts+=PESO(q.d);}
    else { const k=DSHORT[q.d]+' – '+q.t; temas[k]=(temas[k]||0)+PESO(q.d); } });
  const zerou = ORDER.filter(d=>pd[d].t>0 && pd[d].c===0);
  const m1 = ORDER.filter(d=>d!=='es').reduce((s,d)=>s+pd[d].pts,0);
  return {pd,acertos,nota,zerou,m1,m2:pd.es.pts,aprov:nota>=57.5&&zerou.length===0,temas};
}
function faixa(n){
  if(n<57.5) return {t:'Abaixo do mínimo – eliminado',c:'#c53030',d:'Não atinge os 57,5 pontos exigidos. Foque nos Específicos: cada acerto ali vale 2,5 pontos.'};
  if(n<80) return {t:'Habilitado, mas longe da zona competitiva',c:'#b7791f',d:'Passa no mínimo do edital, mas em 2024 os perfis de TI tiveram disputa muito acima disso. Meta: subir para 80+.'};
  if(n<95) return {t:'Zona competitiva para cadastro de reserva (estimativa)',c:'#2b6cb0',d:'Desempenho sólido. Para disputar vaga imediata, reduza erros nos Específicos e em Português.'};
  return {t:'Zona competitiva para vagas imediatas (estimativa)',c:'#2f855a',d:'Desempenho de topo. Em 2024 os primeiros colocados de Desenvolvimento ficaram próximos da nota máxima — mantenha o ritmo.'};
}

function reviewCard(q,n,a){
  const ok=a===q.g;
  const st={ans:{[q.id]:a},cut:{}};
  return `<div class="q" id="rq${n-1}"><div class="qhead"><span class="qnum">Questão ${n}</span><span class="qdisc">${DSHORT[q.d]} · ${q.t}</span>
    <span class="qdisc" style="background:${!a?'#edf2f7':ok?'#c6f6d5':'#fed7d7'}">${!a?'Em branco':ok?'✔ Acertou':'✘ Marcou '+a}</span></div>
    <div class="enun">${q.e}</div>${optHTML(q,st,true)}
    <div class="exp ${ok?'':'bad'}"><b>Gabarito: ${q.g}</b><br>${q.x}</div></div>`;
}

// ================== TREINO (feedback imediato) ==================
function startTrain(){
  const ds=[...document.querySelectorAll('.dsel:checked')].map(x=>x.value);
  if(!ds.length){alert('Escolha pelo menos uma disciplina.');return;}
  let pool=BANK.filter(q=>ds.includes(q.d));
  if($('#naoVistas').checked) pool=pool.filter(q=>!stats[q.id]);
  if(!pool.length){alert('Não há questões nesse filtro. Desmarque “só questões que nunca respondi”.');return;}
  const n=Math.max(1,Math.min(+$('#qtd').value||20,pool.length));
  runPractice(shuffle(pool).slice(0,n),'Treino – '+ds.map(d=>DSHORT[d]).join(', '));
}
function startErrors(){ runPractice(shuffle(errosAtuais()),'Revisão dos erros'); }
function runPractice(qs,nome){
  S={mode:'train',nome,qs,ans:{},cut:{},i:0,ok:0,done:false};
  header(nome,'Feedback imediato: responda e leia a explicação',false);
  renderTrain();
}
function renderTrain(){
  const q=S.qs[S.i], a=S.ans[q.id], locked=!!a, ok=a===q.g;
  app.innerHTML=`
  <div class="card" style="margin-bottom:1rem"><div class="row" style="justify-content:space-between"><b>${S.i+1} de ${S.qs.length}</b><span class="muted">Acertos: ${S.ok} de ${Object.keys(S.ans).length}</span></div>
    <div class="bar" style="margin-top:.4rem"><i style="width:${(S.i+1)/S.qs.length*100}%"></i></div></div>
  <div class="q"><div class="qhead"><span class="qnum">${DSHORT[q.d]}</span><span class="qdisc">${q.t}${stats[q.id]?` · já respondida ${stats[q.id].c+stats[q.id].w}x`:''}</span></div>
    <div class="enun">${q.e}</div>
    <div>${locked?optHTML(q,S,true):q.o.map((t,i)=>`<div class="opt ${S.cut[q.id+L[i]]?'cut':''}" onclick="answerTrain(${q.id},'${L[i]}')"><span class="l">${L[i]})</span><span class="t">${t}</span><button class="cutb" title="Riscar" onclick="event.stopPropagation();S.cut[${q.id}+'${L[i]}']=!S.cut[${q.id}+'${L[i]}'];renderTrain()">✂</button></div>`).join('')}</div>
    ${locked?`<div class="exp ${ok?'':'bad'}"><b>${ok?'✔ Correto!':'✘ Resposta certa: '+q.g}</b><br>${q.x}</div>`:''}
    <div class="nav">
      <button class="btn sec" ${S.i?'':'disabled style="opacity:.4"'} onclick="S.i--;renderTrain()">← Anterior</button>
      ${S.i<S.qs.length-1?`<button class="btn" ${locked?'':'style="opacity:.6"'} onclick="S.i++;renderTrain();window.scrollTo(0,0)">${locked?'Próxima →':'Pular →'}</button>`:`<button class="btn ok" onclick="endTrain()">Concluir</button>`}
    </div></div>`;
}
function answerTrain(id,l){
  const q=S.qs[S.i]; if(S.ans[id])return; S.ans[id]=l; const ok=l===q.g; if(ok)S.ok++; record(q,ok); renderTrain();
}
function endTrain(){
  const n=Object.keys(S.ans).length; S.done=true;
  const byD={}; S.qs.forEach(q=>{if(!S.ans[q.id])return;byD[q.d]=byD[q.d]||{c:0,t:0};byD[q.d].t++;if(S.ans[q.id]===q.g)byD[q.d].c++;});
  app.innerHTML=`<div class="card" style="text-align:center"><div class="big">${S.ok}/${n}</div><p style="color:inherit">acertos no treino (${n?Math.round(S.ok/n*100):0}%)</p>
    <table style="margin-top:.8rem">${Object.entries(byD).map(([d,v])=>`<tr><td>${DSHORT[d]}</td><td class="n">${v.c}/${v.t}</td></tr>`).join('')}</table>
    <p class="muted" style="margin-top:.8rem">As questões erradas foram para a “Revisão dos erros”. Refaça-as em 1, 3 e 7 dias — é assim que o conteúdo fixa.</p><br>
    <button class="btn" onclick="S=null;home()">Voltar ao início</button></div>`;
}

// ================== BANCO COMENTADO ==================
function showBank(){
  const d=$('#bdisc').value; const qs=BANK.filter(q=>!d||q.d===d);
  S={mode:'review',qs,ans:{},done:true};
  header('Banco comentado'+(d?' – '+DSHORT[d]:''),qs.length+' questões com gabarito e explicação',false);
  app.innerHTML=`<p class="muted" style="margin-bottom:.8rem">Dica: tente responder mentalmente antes de ler o gabarito (recuperação ativa).</p>`+
    qs.map((q,i)=>`<div class="q"><div class="qhead"><span class="qnum">#${q.id}</span><span class="qdisc">${DSHORT[q.d]} · ${q.t}</span></div><div class="enun">${q.e}</div>
      ${q.o.map((t,j)=>`<div class="opt lock"><span class="l">${L[j]})</span><span class="t">${t}</span></div>`).join('')}
      <details style="margin-top:.5rem"><summary class="btn sec sm" style="display:inline-block">Ver gabarito e explicação</summary><div class="exp"><b>Gabarito: ${q.g}</b><br>${q.x}</div></details></div>`).join('');
  window.scrollTo(0,0);
}

home();
</script>
