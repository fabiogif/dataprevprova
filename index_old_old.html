<script>
// Questões 1–70 (simulado original revisado + explicações)
// Formato: [disciplina, tema, enunciado, [A,B,C,D,E], gabarito, explicação]
const Q1 = [
[`pt`,`Reescrita`,`<p>“A transformação digital na administração pública não se resume à simples adoção de novas tecnologias; ela exige uma mudança cultural profunda.”</p><p>Assinale a reescrita que preserva o sentido e está gramaticalmente correta.</p>`,
[`A transformação digital na administração pública resume-se apenas à adoção de novas tecnologias.`,`Não se resume a transformação digital na administração pública à adoção de novas tecnologias.`,`A transformação digital na administração pública não se limita à mera adoção de novas tecnologias; exige mudança cultural profunda.`,`A transformação digital, na administração pública, não se resume a simples adoção de novas tecnologias.`,`Não se resume a transformação digital na administração pública a adoção de novas tecnologias.`],`C`,
`<b>C</b> troca “resume-se” por “limita-se” e “simples” por “mera” (sinônimos no contexto), mantém a crase (limitar-se <b>a</b> + <b>a</b> adoção) e preserva a segunda ideia (exige mudança cultural). <b>A</b> inverte o sentido (nega vira afirma). <b>B</b> é gramatical, mas apaga “simples” e toda a segunda oração — perde sentido. <b>D</b> e <b>E</b> erram a crase: “resumir-se <b>à</b> adoção”. <br>💡 <i>FGV adora reescrita: confira (1) sentido, (2) correção gramatical e (3) se alguma informação sumiu.</i>`],

[`pt`,`Pontuação`,`<p>Assinale a opção em que a vírgula está <b>incorretamente</b> empregada.</p>`,
[`Os desenvolvedores que dominam Spring Boot são muito requisitados.`,`Os desenvolvedores mais experientes da equipe, participaram da migração do sistema.`,`Ontem, após a reunião, a equipe decidiu adotar microsserviços.`,`Brasília, capital do Brasil, sediará o evento.`,`Sim, concordamos com a proposta apresentada.`],`B`,
`Regra de ouro: <b>não se separa sujeito de verbo por vírgula</b>. Em B, o sujeito “Os desenvolvedores mais experientes da equipe” foi separado do verbo “participaram”. <b>A</b>: oração adjetiva restritiva — sem vírgulas, correto. <b>C</b>: adjuntos adverbiais antecipados — vírgulas corretas. <b>D</b>: aposto explicativo entre vírgulas. <b>E</b>: vírgula após advérbio de afirmação isolado. <br>💡 <i>Sujeito longo é a pegadinha clássica: quanto maior o sujeito, maior a tentação da vírgula indevida.</i>`],

[`pt`,`Sintaxe`,`<p>“É preciso estar atento e forte.” A oração reduzida de infinitivo exerce a função de:</p>`,
[`Objeto direto`,`Predicativo do sujeito`,`Complemento nominal`,`Sujeito`,`Adjunto adnominal`],`D`,
`Estrutura “<b>É + adjetivo + oração</b>” (é preciso, é necessário, é importante…): a oração é <b>subordinada substantiva subjetiva</b>, ou seja, funciona como <b>sujeito</b>. Teste: “Estar atento e forte é preciso.” — “preciso” é o predicativo; “estar atento e forte” é o sujeito. <br>💡 <i>Sempre que aparecer “é bom/é necessário/convém + oração”, pense em sujeito oracional.</i>`],

[`pt`,`Concordância`,`<p>Assinale a opção com concordância verbal correta.</p>`,
[`Mais de um desenvolvedor discordou da arquitetura proposta.`,`Houveram muitos problemas na integração.`,`Fazem dois anos que adotamos Scrum.`,`Devem haver soluções mais elegantes.`,`Se tratam de questões técnicas complexas.`],`A`,
`<b>A</b>: “mais de um” leva o verbo ao <b>singular</b> (salvo reciprocidade). <b>B</b>: “haver” = existir é <b>impessoal</b> → “Houve”. <b>C</b>: “fazer” indicando tempo é impessoal → “Faz dois anos”. <b>D</b>: a impessoalidade passa ao auxiliar → “Deve haver”. <b>E</b>: “tratar-se de” é impessoal (índice de indeterminação) → “Trata-se de”. <br>💡 <i>Haver (existir), fazer (tempo) e tratar-se de: sempre singular.</i>`],

[`pt`,`Crase`,`<p>Assinale a opção em que o uso da crase está correto.</p>`,
[`Fui à pé até o escritório.`,`Refiro-me à este documento.`,`Chegamos à uma conclusão.`,`Entreguei o relatório à ela.`,`Dedico-me à análise de requisitos.`],`E`,
`Crase = preposição <b>a</b> + artigo <b>a</b>. Em <b>E</b>: dedicar-se <b>a</b> + <b>a</b> análise = à. Erros: <b>A</b> “pé” é masculino; <b>B</b> antes de pronome demonstrativo “este” não há artigo; <b>C</b> antes de artigo indefinido “uma” não há crase; <b>D</b> antes de pronome pessoal “ela” não há crase. <br>💡 <i>Troque por masculino: “dedico-me <b>ao</b> estudo” → se virar “ao”, há crase.</i>`],

[`pt`,`Orações`,`<p>No período “Embora a equipe fosse experiente, o projeto atrasou”, a oração iniciada por “Embora” classifica-se como:</p>`,
[`Subordinada substantiva subjetiva`,`Subordinada adjetiva restritiva`,`Subordinada adverbial concessiva`,`Coordenada sindética adversativa`,`Subordinada adverbial causal`],`C`,
`“Embora” (= ainda que, mesmo que, conquanto) introduz <b>concessão</b>: um fato que seria obstáculo, mas não impede a ação principal. <b>D</b> é a pegadinha: a ideia de contraste é parecida com “mas”, porém “embora” é conjunção <b>subordinativa</b> (verbo no subjuntivo), não coordenativa. <br>💡 <i>Reescrita típica da FGV: “A equipe era experiente, <b>mas</b> o projeto atrasou” — muda a classificação, mantém o sentido.</i>`],

[`pt`,`Colocação pronominal`,`<p>Assinale a opção em que o pronome está corretamente colocado, segundo a norma-padrão.</p>`,
[`Me entregue o relatório até amanhã.`,`Entregar-me-ão o relatório amanhã.`,`Entregariam-me o relatório se pedisse.`,`Me entregariam o relatório se eu pedisse.`,`Entregaria-me o relatório amanhã.`],`B`,
`Com verbo no <b>futuro do presente</b> (entregarão) ou <b>futuro do pretérito</b> (entregariam) e sem palavra atrativa, a norma exige <b>mesóclise</b>: entregar-me-ão / entregar-me-iam. Por isso <b>C</b> e <b>E</b> erram (ênclise no futuro é proibida). <b>A</b> e <b>D</b>: a norma-padrão não admite iniciar frase com pronome oblíquo átono. <br>💡 <i>Futuro + início de frase = mesóclise. Com palavra atrativa (não, que, já…) → próclise: “Não me entregarão”.</i>`],

[`pt`,`Acentuação`,`<p>Assinale a opção em que todas as palavras estão corretamente acentuadas, conforme o Acordo Ortográfico vigente.</p>`,
[`idéia, assembléia, herói, pôde`,`ideia, assembleia, herói, pôde`,`idéia, assembleia, heroi, pode`,`ideia, assembléia, herói, pode`,`idéia, assembléia, heroi, pôde`],`B`,
`O Acordo Ortográfico <b>eliminou o acento dos ditongos abertos ÉI e ÓI em paroxítonas</b>: ideia, assembleia, jiboia. Mas o acento <b>continua nas oxítonas e monossílabos</b>: herói, papéis, dói. “Pôde” (passado) mantém o <b>acento diferencial</b> em relação a “pode” (presente). <br>💡 <i>Paroxítona perdeu (ideia); oxítona manteve (herói). “Pôde/pode” e “pôr/por” ainda têm acento diferencial.</i>`],

[`pt`,`Orações adjetivas`,`<p>“O código legado, que era pouco documentado, dificultava a manutenção.” A oração entre vírgulas classifica-se como:</p>`,
[`Aposto explicativo`,`Subordinada adjetiva explicativa`,`Subordinada adjetiva restritiva`,`Subordinada adverbial causal`,`Subordinada substantiva apositiva`],`B`,
`Oração iniciada por pronome relativo “que” (= o qual) e <b>entre vírgulas</b> = <b>adjetiva explicativa</b>: acrescenta informação sobre todo o antecedente. Sem vírgulas seria <b>restritiva</b> (restringiria: só o código legado pouco documentado). <br>💡 <i>Vírgula muda sentido! Tema recorrente na FGV: “Os servidores, que trabalham remoto, …” (todos) × “Os servidores que trabalham remoto …” (só alguns).</i>`],

[`pt`,`Termos da oração`,`<p>Assinale a opção em que o termo destacado tem função de <b>adjunto adnominal</b>.</p>`,
[`A decisão foi tomada <b>pelo gerente</b>.`,`Preciso <b>de ajuda</b> urgente.`,`Comprei um livro <b>interessante</b>.`,`O relatório foi entregue <b>ao cliente</b>.`,`Ele é favorável <b>à mudança</b>.`],`C`,
`Adjunto adnominal caracteriza um <b>substantivo</b> sem ser exigido por ele: “interessante” qualifica “livro”. <b>A</b>: agente da passiva. <b>B</b>: objeto indireto (precisar <b>de</b>). <b>D</b>: objeto indireto (entregar <b>a</b> alguém). <b>E</b>: complemento nominal (o adjetivo “favorável” exige preposição “a”). <br>💡 <i>Complemento nominal completa nome transitivo (favorável a, necessidade de); adjunto adnominal apenas qualifica.</i>`],

[`pt`,`Regência verbal`,`<p>Assinale a opção em que há <b>erro</b> de regência verbal.</p>`,
[`Assisti ao filme ontem.`,`Aspiro uma promoção na carreira.`,`Prefiro Java a Python.`,`Obedecemos às normas da empresa.`,`Lembrei-me do prazo de entrega.`],`B`,
`“Aspirar” no sentido de <b>desejar/almejar</b> é transitivo indireto: “Aspiro <b>a</b> uma promoção”. (No sentido de respirar/sorver é direto: aspirar o ar.) Demais: <b>assistir</b> (ver) = assistir <b>a</b>; <b>preferir</b> = preferir algo <b>a</b> algo (nunca “do que”); <b>obedecer</b> = obedecer <b>a</b>; <b>lembrar-se de</b> (pronominal pede “de”). <br>💡 <i>Verbos queridinhos da FGV: assistir, aspirar, visar, preferir, obedecer, implicar.</i>`],

[`pt`,`Conectores`,`<p>“Não só o código, mas também a documentação precisa ser revisada.” O conectivo expressa ideia de:</p>`,
[`Adição / ênfase`,`Oposição`,`Alternância`,`Conclusão`,`Explicação`],`A`,
`“Não só… mas também” é conjunção <b>coordenativa aditiva</b> correlativa: soma dois elementos com ênfase no segundo. A presença do “mas” engana (parece oposição), mas aqui não há contraste. <br>💡 <i>Equivalentes: “tanto… quanto”, “não apenas… como também”.</i>`],

[`en`,`Reading`,`<p>“Microservices architecture allows teams to develop, deploy, and scale services independently. However, it also introduces complexity in terms of distributed data management and inter-service communication.”</p><p>According to the text, a disadvantage of microservices is:</p>`,
[`inability to scale services independently`,`lack of independent deployment`,`increased complexity in data management and communication`,`requirement of a single technology stack`,`reduced team autonomy`],`C`,
`O conector <b>“However”</b> (contudo) sinaliza a desvantagem: complexidade em gerenciamento de dados distribuídos e comunicação entre serviços. A e B contradizem o texto (são vantagens); D e E não são mencionados. <br>💡 <i>Em inglês de concurso, procure os conectores: however, nevertheless, although = contraste.</i>`],

[`en`,`Vocabulary`,`<p>“The Spring Boot framework aims to simplify the bootstrap and development of new Spring applications.” The word “aims” is closest in meaning to:</p>`,
[`fails`,`intends`,`refuses`,`pretends`,`delays`],`B`,
`<b>To aim</b> = ter como objetivo, pretender → <b>intends</b>. Cuidado com o falso cognato <b>pretend</b> (= fingir), a pegadinha clássica. <br>💡 <i>Falsos cognatos frequentes: pretend (fingir), actually (na verdade), eventually (finalmente), assist (ajudar), library (biblioteca).</i>`],

[`en`,`Reading`,`<p>“Continuous Integration (CI) is a practice where developers frequently merge their code changes into a central repository, after which automated builds and tests are run.” The main benefit implied is:</p>`,
[`early detection of integration problems`,`elimination of the need for testing`,`reduction of code quality`,`slower delivery cycles`,`manual deployment only`],`A`,
`Integrar com frequência + build/teste automáticos = problemas de integração descobertos <b>cedo</b>. B contradiz o texto (há testes); C, D e E são o oposto do objetivo da CI. <br>💡 <i>Questões de inferência: a resposta é consequência lógica do texto, não algo novo.</i>`],

[`en`,`Grammar – Conditionals`,`<p>Choose the correct option to complete: “If the requirements _____ clearer, the team would have delivered the feature on time.”</p>`,
[`was`,`were`,`has been`,`had been`,`would be`],`D`,
`A segunda parte “<b>would have delivered</b>” indica <b>third conditional</b> (passado hipotético, algo que não aconteceu). Estrutura: <b>If + past perfect (had been), would have + particípio</b>. “were” seria second conditional (presente hipotético). <br>💡 <i>1ª: if + present, will. 2ª: if + past, would. 3ª: if + had + particípio, would have + particípio.</i>`],

[`en`,`Reading`,`<p>“Technical debt is the implied cost of additional rework caused by choosing an easy solution now instead of using a better approach that would take longer.” Technical debt refers to:</p>`,
[`financial loans for software projects`,`the cost of hardware upgrades`,`future rework due to short-term decisions`,`the price of software licenses`,`salary costs of developers`],`C`,
`A definição: custo de <b>retrabalho futuro</b> por escolher a solução fácil agora. “Debt” é metáfora — não é dívida financeira (A). <br>💡 <i>Conceito também cobrado em SonarQube: ele estima a dívida técnica em tempo de correção.</i>`],

[`en`,`Vocabulary`,`<p>In the sentence “The API must be resilient to network failures”, the word “resilient” means:</p>`,
[`vulnerable`,`able to recover quickly`,`slow`,`expensive`,`complicated`],`B`,
`<b>Resilient</b> = capaz de se recuperar/resistir a falhas. Em arquitetura: resiliência = retries, circuit breaker, fallback. “Vulnerable” é praticamente o antônimo.`],

[`en`,`Reading`,`<p>“Pair programming is a technique in which two developers work together at one workstation.” According to this definition, pair programming involves:</p>`,
[`two people collaborating on the same code`,`developers working in different time zones`,`automatic code generation`,`writing tests after the code`,`code review by a manager only`],`A`,
`“Two developers work together at one workstation” = duas pessoas no mesmo código. Prática do <b>XP (Extreme Programming)</b>: um é o “driver” (digita), o outro o “navigator” (revisa e pensa na estratégia).`],

[`en`,`Vocabulary`,`<p>Choose the best synonym for “refactor” in a software context:</p>`,
[`delete`,`rewrite from scratch`,`ignore`,`restructure without changing behavior`,`document`],`D`,
`Refatorar = <b>melhorar a estrutura interna sem alterar o comportamento externo</b> (Martin Fowler). Reescrever do zero (B) não é refatorar. <br>💡 <i>No TDD, refatorar é a 3ª etapa (red → green → refactor), e os testes garantem que o comportamento não mudou.</i>`],

[`en`,`Reading`,`<p>“Legacy systems are often difficult to maintain because of outdated technology and poor documentation.” The main reason given for maintenance difficulty is:</p>`,
[`high cost of cloud services`,`lack of developers`,`outdated technology and poor documentation`,`excessive use of microservices`,`too many automated tests`],`C`,
`“<b>Because of</b>” introduz a causa: tecnologia ultrapassada e documentação pobre. Questão literal — a resposta está explícita. <br>💡 <i>Conectores de causa: because (of), due to, owing to, since, as.</i>`],

[`en`,`Grammar – Verb patterns`,`<p>Complete: “The team decided _____ the new feature behind a feature flag.”</p>`,
[`release`,`to release`,`releasing`,`released`,`releases`],`B`,
`<b>Decide</b> é seguido de <b>to + infinitivo</b> (decide to do). Outros do mesmo grupo: want, plan, agree, need, hope. Verbos seguidos de <b>-ing</b>: enjoy, avoid, finish, consider, suggest. <br>💡 <i>Memorize os dois grupos — cai muito.</i>`],

[`en`,`Reading – HTTP`,`<p>“Idempotent operations can be applied multiple times without changing the result beyond the initial application.” An example of an idempotent HTTP method is:</p>`,
[`PUT`,`POST`,`PATCH (always)`,`CONNECT`,`TRACE (never)`],`A`,
`<b>PUT</b> substitui o recurso pelo estado enviado: enviar 1 ou 10 vezes dá o mesmo resultado. Também idempotentes: GET, HEAD, OPTIONS, DELETE. <b>POST</b> não é (cada chamada pode criar um novo recurso). PATCH <b>não é garantidamente</b> idempotente (depende da operação, ex.: “incrementar +1”). <br>💡 <i>Seguros (não alteram estado): GET, HEAD, OPTIONS. Idempotentes: seguros + PUT + DELETE.</i>`],

[`en`,`Reading – Security`,`<p>“The principle of least privilege states that a user should be given only the minimum levels of access necessary to perform their job.” This principle is mainly related to:</p>`,
[`performance optimization`,`user interface design`,`database indexing`,`security and access control`,`code formatting`],`D`,
`Menor privilégio = <b>controle de acesso</b>/segurança. Reduz o impacto de uma conta comprometida. Relaciona-se com OWASP A01 (Broken Access Control) e com a ISO 27002.`],

[`rl`,`Lógica de argumentação`,`<p>Sabe-se que todo desenvolvedor Java conhece Spring e que algum desenvolvedor Java não conhece Hibernate. Logo, é necessariamente verdadeiro que:</p>`,
[`Todo desenvolvedor que conhece Spring conhece Hibernate.`,`Algum desenvolvedor que conhece Spring não conhece Hibernate.`,`Nenhum desenvolvedor Java conhece Hibernate.`,`Todo desenvolvedor que conhece Spring é desenvolvedor Java.`,`Nenhum desenvolvedor que conhece Hibernate conhece Spring.`],`B`,
`Desenhe os conjuntos: o conjunto <b>Java</b> está dentro de <b>Spring</b>. Existe um elemento de Java fora de Hibernate. Como esse elemento também está em Spring, então <b>algum que conhece Spring não conhece Hibernate</b>. A: falso (esse elemento é contraexemplo). C: “algum não conhece” não implica “nenhum conhece”. D: inverte a inclusão. E: nada garante. <br>💡 <i>Em silogismos, sempre desenhe diagramas de Venn e procure o elemento que “testemunha” a conclusão.</i>`],

[`rl`,`Conjuntos`,`<p>Em uma equipe de 12 desenvolvedores, 7 conhecem Java, 6 conhecem Python e 3 conhecem ambas. Quantos não conhecem nenhuma das duas?</p>`,
[`2`,`3`,`4`,`5`,`1`],`A`,
`Princípio da inclusão-exclusão: |J ∪ P| = 7 + 6 − 3 = <b>10</b>. Não conhecem nenhuma: 12 − 10 = <b>2</b>. <br>💡 <i>Erro comum: somar 7 + 6 = 13 e esquecer de tirar a interseção contada duas vezes.</i>`],

[`rl`,`Negação`,`<p>A negação de “Todo sistema é seguro” é:</p>`,
[`Nenhum sistema é seguro.`,`Todo sistema não é seguro.`,`Algum sistema não é seguro.`,`Algum sistema é seguro.`,`Nenhum sistema não é seguro.`],`C`,
`Para negar “Todo A é B”, basta <b>um contraexemplo</b>: “Algum A não é B”. “Nenhum é seguro” (A) é o <b>contrário</b>, não a negação — exagera. <br>💡 <i>Tabela: ¬(Todo A é B) = Algum A não é B. ¬(Algum A é B) = Nenhum A é B.</i>`],

[`rl`,`Condicional`,`<p>Se A → B e B → C, então é necessariamente verdadeiro que:</p>`,
[`C → A`,`A → C`,`~A → ~C`,`C → ~A`,`~C → A`],`B`,
`<b>Silogismo hipotético</b> (transitividade): A → B, B → C ⊢ A → C. Equivalente: ~C → ~A (contrapositiva). A (recíproca) e C (inversa) <b>não</b> são equivalentes à condicional. <br>💡 <i>p → q ≡ ~q → ~p ≡ ~p ∨ q. Nunca troque a ordem sem negar os dois lados.</i>`],

[`rl`,`Sequências`,`<p>Em uma sequência, cada termo é o triplo do anterior menos 2. Se o primeiro termo é 3, o quarto termo é:</p>`,
[`19`,`25`,`55`,`61`,`79`],`C`,
`a₁ = 3; a₂ = 3·3 − 2 = 7; a₃ = 3·7 − 2 = 19; a₄ = 3·19 − 2 = <b>55</b>. (Observação: o gabarito do arquivo original marcava 79, o que estava errado — 79 não aparece na sequência.) <br>💡 <i>Em sequências recursivas, calcule termo a termo e confira com cuidado: 19 é o 3º termo, pegadinha para quem conta errado.</i>`],

[`ia`,`IA no setor público`,`<p>Sobre o uso de Inteligência Artificial generativa no setor público, é correto afirmar que:</p>`,
[`A LGPD proíbe totalmente o uso de modelos generativos.`,`Modelos generativos não apresentam riscos de privacidade.`,`O uso de IA generativa exige atenção à proteção de dados e transparência algorítmica.`,`Apenas o setor privado pode utilizar modelos de linguagem.`,`A governança de IA é irrelevante para órgãos previdenciários.`],`C`,
`A LGPD não proíbe IA, mas exige base legal, finalidade, minimização e segurança no tratamento de dados. Transparência e explicabilidade são pilares de IA responsável. Alternativas com “totalmente”, “apenas”, “irrelevante” são absolutas — geralmente erradas. <br>💡 <i>FGV em Atualidades/IA: desconfie de termos absolutos.</i>`],

[`ia`,`Ética em LLMs`,`<p>Uma das principais preocupações éticas no uso de modelos de linguagem de grande escala (LLMs) é:</p>`,
[`Viés algorítmico e geração de conteúdo falso (alucinações)`,`Consumo excessivo de papel`,`Impossibilidade de uso em nuvem`,`Falta de suporte a idiomas ocidentais`,`Incompatibilidade com sistemas legados`],`A`,
`<b>Viés</b> (o modelo reproduz preconceitos dos dados de treino) e <b>alucinação</b> (gera informação plausível, mas falsa) são os riscos centrais. Mitigações: RAG (buscar em fontes confiáveis), revisão humana, avaliação de viés.`],

[`ia`,`Conceitos de IA`,`<p>O conceito de “IA generativa” refere-se a sistemas capazes de:</p>`,
[`Apenas classificar dados existentes`,`Criar novos conteúdos (texto, imagem, código etc.) a partir de padrões aprendidos`,`Substituir completamente desenvolvedores humanos`,`Funcionar apenas offline`,`Processar exclusivamente dados estruturados`],`B`,
`IA <b>generativa</b> produz conteúdo novo; IA <b>discriminativa</b>/preditiva classifica ou prevê (A). Exemplos: LLMs (texto/código), modelos de difusão (imagem).`],

[`ia`,`Governo digital`,`<p>No contexto de governo digital brasileiro, a transformação digital busca principalmente:</p>`,
[`Eliminar todos os servidores públicos`,`Aumentar a burocracia presencial`,`Centralizar todos os dados em um único órgão`,`Melhorar a eficiência dos serviços prestados ao cidadão`,`Proibir o uso de nuvem pública`],`D`,
`A Lei do Governo Digital (Lei 14.129/2021) tem foco no cidadão: serviços digitais, desburocratização, eficiência e transparência. A Dataprev é peça central (ex.: Meu INSS, CNIS).`],

[`ia`,`Machine learning`,`<p>Sobre aprendizado de máquina (machine learning), é correto afirmar que:</p>`,
[`Todo modelo de ML é necessariamente supervisionado`,`Modelos de ML nunca precisam de dados de treinamento`,`Existem abordagens supervisionadas, não supervisionadas e por reforço`,`ML é sinônimo exclusivo de redes neurais profundas`,`Apenas dados rotulados podem ser utilizados`],`C`,
`<b>Supervisionado</b>: dados rotulados (classificação, regressão). <b>Não supervisionado</b>: sem rótulo (clusterização, redução de dimensionalidade). <b>Por reforço</b>: agente aprende por recompensa. Deep learning é um <b>subconjunto</b> de ML (D errada).`],

[`ia`,`Governança de IA`,`<p>Uma boa prática de governança de IA em órgãos públicos inclui:</p>`,
[`Documentar decisões automatizadas e permitir contestação pelo cidadão`,`Utilizar modelos de caixa-preta sem explicabilidade`,`Ignorar a LGPD quando se trata de IA`,`Compartilhar todos os dados de treinamento publicamente sem restrição`,`Proibir qualquer uso de IA`],`A`,
`O <b>art. 20 da LGPD</b> garante ao titular o direito de solicitar <b>revisão de decisões tomadas unicamente com base em tratamento automatizado</b>. Documentar e permitir contestação é governança responsável.`],

[`lg`,`LGPD – Bases legais`,`<p>De acordo com a LGPD, o tratamento de dados pessoais somente poderá ser realizado nas hipóteses abaixo, EXCETO:</p>`,
[`Mediante consentimento do titular`,`Quando o controlador achar conveniente, sem base legal`,`Para cumprimento de obrigação legal ou regulatória`,`Para execução de contrato do qual o titular seja parte`,`Para proteção da vida ou da incolumidade física do titular`],`B`,
`O <b>art. 7º</b> lista 10 bases legais (consentimento, obrigação legal, políticas públicas, pesquisa, contrato, exercício de direitos, proteção da vida, tutela da saúde, legítimo interesse, proteção do crédito). Não existe tratamento “por conveniência” sem base legal. <br>💡 <i>Consentimento é só UMA das bases — e o poder público normalmente usa “execução de políticas públicas” ou “obrigação legal”.</i>`],

[`lg`,`LGPD – Encarregado`,`<p>O Encarregado (DPO) na LGPD tem como uma de suas atribuições:</p>`,
[`Aceitar reclamações e comunicações dos titulares e prestar esclarecimentos`,`Definir unilateralmente as bases legais de tratamento`,`Substituir o controlador em todas as decisões`,`Autorizar qualquer transferência internacional de dados`,`Eliminar a necessidade de registro de operações`],`A`,
`<b>Art. 41, §2º</b>: o encarregado aceita reclamações dos titulares, recebe comunicações da ANPD, orienta funcionários e executa atribuições do controlador. Ele é o <b>canal de comunicação</b>, não quem decide (quem decide é o <b>controlador</b>).`],

[`lg`,`LGPD – Dados sensíveis`,`<p>Dados pessoais sensíveis, segundo a LGPD, incluem, entre outros:</p>`,
[`Nome e endereço residencial`,`CPF e RG`,`Dados referentes à saúde, origem racial e convicção religiosa`,`Endereço de e-mail corporativo`,`Número de telefone celular`],`C`,
`<b>Art. 5º, II</b>: sensíveis = origem racial ou étnica, convicção religiosa, opinião política, filiação a sindicato ou organização religiosa/filosófica/política, saúde, vida sexual, dado <b>genético</b> ou <b>biométrico</b>. CPF, RG, nome e telefone são dados pessoais <b>comuns</b>. <br>💡 <i>Biometria (digital, face) é sensível — pegadinha frequente.</i>`],

[`lg`,`Segurança da Informação`,`<p>Os três pilares clássicos da segurança da informação (tríade CIA) são:</p>`,
[`Confidencialidade, Integridade e Autenticidade`,`Confidencialidade, Integridade e Auditoria`,`Confidencialidade, Identidade e Disponibilidade`,`Confidencialidade, Integridade e Disponibilidade`,`Controle, Integridade e Disponibilidade`],`D`,
`CID/CIA: <b>Confidencialidade</b> (só quem pode acessa), <b>Integridade</b> (não alterado indevidamente), <b>Disponibilidade</b> (acessível quando necessário). Autenticidade e não repúdio (irretratabilidade) são princípios <b>complementares</b>, não da tríade.`],

[`lg`,`LGPD – Segurança`,`<p>De acordo com a LGPD, o controlador deve adotar medidas de segurança técnicas e administrativas aptas a proteger os dados pessoais de:</p>`,
[`Apenas acessos não autorizados externos`,`Acessos não autorizados e de situações acidentais ou ilícitas de destruição, perda, alteração, comunicação ou difusão`,`Somente ataques de ransomware`,`Apenas falhas de hardware`,`Única e exclusivamente vazamentos intencionais`],`B`,
`Texto quase literal do <b>art. 46</b>. Note: protege contra incidentes <b>acidentais</b> e <b>ilícitos</b> — não só ataques externos. As demais usam “apenas/somente/exclusivamente”.`],

[`es`,`Frameworks Java`,`<p>No desenvolvimento de software, os frameworks Spring, Spring Boot, Hibernate e JUnit desempenham papéis importantes. Assinale a opção correta:</p>`,
[`O Spring Boot facilita a criação de aplicações standalone com configuração mínima; o Hibernate é um framework ORM.`,`O Hibernate é responsável pela injeção de dependências e o Spring Boot pela persistência.`,`O JUnit é um framework de injeção de dependências.`,`O Spring Cloud substitui completamente o Spring Boot em monolitos.`,`O Hibernate não possui suporte a JPA.`],`A`,
`Papéis: <b>Spring</b> = IoC/DI; <b>Spring Boot</b> = auto-configuração + servidor embutido (standalone, “just run”); <b>Hibernate</b> = ORM e implementação da JPA; <b>JUnit</b> = testes unitários; <b>Spring Cloud</b> = padrões de sistemas distribuídos (config server, discovery, gateway) que roda <b>sobre</b> o Spring Boot. B inverte papéis; E é falsa (Hibernate é a implementação JPA mais usada).`],

[`es`,`Arquitetura`,`<p>Em relação às arquiteturas hexagonal e de microsserviços:</p><p>I. A arquitetura hexagonal visa separar a lógica de negócios das interfaces externas.</p><p>II. Microsserviços compartilham obrigatoriamente o mesmo banco de dados.</p><p>III. Na arquitetura monolítica, os módulos são implantados conjuntamente, como uma unidade.</p><p>Está correto o que se afirma em:</p>`,
[`I, apenas`,`II e III`,`I e III`,`I, II e III`,`II, apenas`],`C`,
`I – correta: hexagonal (Ports and Adapters, Alistair Cockburn) isola o domínio; adaptadores conectam banco, UI, filas. II – <b>errada</b>: o recomendado é <b>database per service</b>; banco compartilhado gera acoplamento. III – correta: monólito = um único artefato implantável. <br>💡 <i>Em “I, II, III”, elimine: achando uma errada, corte todas as alternativas que a contêm.</i>`],

[`es`,`Interoperabilidade`,`<p>Sobre XML, XSLT e JSON, assinale a opção correta:</p>`,
[`JSON é mais verboso que XML e exige schema obrigatório.`,`JSON é formato leve de intercâmbio de dados, amplamente usado em APIs REST; XSLT transforma documentos XML.`,`XSLT é linguagem de consulta para bancos relacionais.`,`XML não permite validação por schema.`,`JSON e XML são semanticamente idênticos.`],`B`,
`<b>JSON</b>: leve, pares chave-valor, arrays; schema opcional (JSON Schema). <b>XML</b>: mais verboso, validável por <b>DTD/XSD</b>; <b>XPath</b> navega; <b>XSLT</b> transforma XML em outro formato (XML, HTML, texto). SOAP usa XML; REST geralmente JSON.`],

[`es`,`Scrum`,`<p>No Scrum, o artefato que representa o trabalho a ser realizado no próximo Sprint é o:</p>`,
[`Product Backlog`,`Definition of Done`,`Sprint Retrospective`,`Sprint Backlog`,`Increment`],`D`,
`Scrum Guide 2020 — 3 artefatos e seus <b>compromissos</b>: Product Backlog → <b>Meta do Produto</b>; <b>Sprint Backlog</b> (Meta da Sprint + itens selecionados + plano) → <b>Meta da Sprint</b>; Increment → <b>Definition of Done</b>. Retrospective é <b>evento</b>, não artefato. <br>💡 <i>Pegadinha: DoD é compromisso do Incremento, não artefato.</i>`],

[`es`,`Testes`,`<p>Sobre testes de software, assinale a opção correta:</p>`,
[`Testes unitários verificam unidades isoladas; testes de integração verificam a interação entre componentes.`,`TDD consiste em escrever o código de produção antes dos testes.`,`Testes de usabilidade são realizados exclusivamente por desenvolvedores.`,`Testes automatizados eliminam a necessidade de testes exploratórios.`,`JUnit é usado apenas para testes de performance.`],`A`,
`Níveis: <b>unitário</b> (menor parte, isolada, com mocks) → <b>integração</b> (interfaces entre componentes) → <b>sistema</b> → <b>aceitação</b>. B inverte o TDD (teste primeiro). C: usabilidade envolve <b>usuários reais</b>. D: exploratório complementa a automação. E: JUnit é para testes unitários/integração.`],

[`es`,`Git / DevOps`,`<p>Em relação ao Git e práticas de DevOps, é correto afirmar que:</p>`,
[`O comando git merge sempre cria um novo commit de merge.`,`CI consiste apenas em deploy automático em produção.`,`O Git permite controle de versão distribuído; feature branches e pull requests facilitam colaboração e revisão.`,`O .gitignore deve ser commitado apenas no final do projeto.`,`Rebase é sempre preferível a merge.`],`C`,
`A: falsa — se não houver divergência, ocorre <b>fast-forward</b> (sem commit de merge; a menos que use --no-ff). B: CI = integrar e testar continuamente; deploy automático é <b>Continuous Deployment</b>. D: .gitignore deve existir desde o início. E: “sempre” — rebase reescreve histórico e não deve ser usado em branches públicas.`],

[`es`,`APIs`,`<p>A ferramenta mais adequada para documentar e descrever endpoints de uma API RESTful de forma padronizada é:</p>`,
[`Hibernate`,`Swagger / OpenAPI`,`JUnit`,`SonarQube`,`Maven`],`B`,
`<b>OpenAPI</b> é a especificação (YAML/JSON) que descreve endpoints, parâmetros, respostas; <b>Swagger</b> é o conjunto de ferramentas (Swagger UI, Editor, Codegen). No Spring Boot: springdoc-openapi. Maven = build/dependências; SonarQube = qualidade.`],

[`es`,`Padrões de projeto`,`<p>Para garantir que exista apenas uma instância de um gerenciador de conexão em toda a aplicação, o padrão mais adequado é:</p>`,
[`Factory Method`,`Strategy`,`Observer`,`Singleton`,`Builder`],`D`,
`<b>Singleton</b> (criacional): uma única instância + ponto global de acesso. Os beans do Spring são singleton por padrão (escopo). Factory Method cria objetos delegando a subclasses; Builder monta objetos complexos passo a passo; Strategy e Observer são comportamentais.`],

[`es`,`Spring`,`<p>No Spring, a anotação @RestController combina as funcionalidades de:</p>`,
[`@Controller + @ResponseBody`,`@Service + @Repository`,`@Component + @Autowired`,`@Entity + @Table`,`@Configuration + @Bean`],`A`,
`<b>@RestController = @Controller + @ResponseBody</b>: o retorno dos métodos é serializado direto no corpo da resposta (JSON), sem resolver view. Estereótipos: @Component (genérico), @Service (negócio), @Repository (persistência, traduz exceções), @Controller (web).`],

[`es`,`Qualidade – SonarQube`,`<p>A ferramenta SonarQube é amplamente utilizada para:</p>`,
[`Gerenciamento de containers Docker`,`Orquestração de microsserviços`,`Análise estática de código, detecção de bugs, code smells e vulnerabilidades`,`Execução de testes de carga`,`Deploy contínuo em produção`],`C`,
`SonarQube faz <b>análise estática</b> (sem executar o código): bugs (confiabilidade), vulnerabilidades e security hotspots (segurança), code smells (manutenibilidade), duplicação, cobertura (importada de JaCoCo), dívida técnica. <b>Quality Gate</b> = conjunto de condições para aprovar o código.`],

[`es`,`JPA`,`<p>Em JPA/Hibernate, a anotação que define o relacionamento “muitos para um” é:</p>`,
[`@OneToMany`,`@ManyToOne`,`@ManyToMany`,`@OneToOne`,`@JoinColumn`],`B`,
`<b>@ManyToOne</b>: muitos pedidos → um cliente. É o lado que normalmente <b>possui a FK</b> (owning side). Fetch padrão: @ManyToOne e @OneToOne = <b>EAGER</b>; @OneToMany e @ManyToMany = <b>LAZY</b>. @JoinColumn apenas configura a coluna de junção.`],

[`es`,`Clean Code`,`<p>Segundo os princípios de Clean Code, um método deve preferencialmente:</p>`,
[`Fazer apenas uma coisa e fazê-la bem`,`Conter o máximo de lógica possível`,`Ter nomes genéricos como process() ou doStuff()`,`Evitar comentários em qualquer circunstância`,`Ter no mínimo 50 linhas`],`A`,
`Robert C. Martin: funções <b>pequenas</b>, que fazem <b>uma coisa só</b>, com nomes <b>descritivos</b> e poucos parâmetros. D é armadilha: Clean Code desencoraja comentários que explicam código ruim, mas aceita comentários úteis (intenção, avisos, TODO, licença).`],

[`es`,`Microsserviços`,`<p>Uma das principais vantagens da arquitetura de microsserviços em relação ao monolito é:</p>`,
[`Maior simplicidade de monitoramento`,`Menor complexidade de comunicação`,`Facilidade de manter um único banco compartilhado`,`Possibilidade de escalar e implantar serviços de forma independente`,`Eliminação total de testes de integração`],`D`,
`Vantagens: <b>deploy e escala independentes</b>, heterogeneidade tecnológica, isolamento de falhas, times autônomos. A, B e C são, na verdade, <b>desvantagens</b> invertidas: monitorar e comunicar ficam mais complexos.`],

[`es`,`REST`,`<p>Em uma API RESTful bem projetada, o método HTTP adequado para atualizar <b>parcialmente</b> um recurso é:</p>`,
[`GET`,`POST`,`PATCH`,`DELETE`,`HEAD`],`C`,
`<b>PATCH</b> = atualização parcial; <b>PUT</b> = substituição completa. HEAD = igual ao GET, mas sem corpo. <br>💡 <i>Palavra-chave no enunciado: “parcialmente” → PATCH.</i>`],

[`es`,`Segurança – OWASP`,`<p>A prática de nunca confiar em dados vindos do cliente e sempre validar/escapar entradas previne principalmente:</p>`,
[`Ataques de negação de serviço`,`Injeção de SQL e Cross-Site Scripting (XSS)`,`Ataques de força bruta`,`Interceptação de tráfego`,`Falhas de disponibilidade`],`B`,
`Validação de entrada + <b>consultas parametrizadas</b> (PreparedStatement) previnem SQL Injection; <b>escapar a saída</b> (output encoding) previne XSS. Na OWASP Top 10 2021, ambos estão em <b>A03: Injection</b>. Força bruta → rate limiting/MFA; interceptação → TLS.`],

[`es`,`TDD`,`<p>No ciclo TDD (Test-Driven Development), a sequência correta é:</p>`,
[`Escrever o teste que falha → escrever o código mínimo para passar → refatorar`,`Escrever o código → escrever o teste → refatorar`,`Refatorar → escrever o teste → escrever o código`,`Escrever o código completo → testar manualmente`,`Escrever documentação → escrever código → testar`],`A`,
`<b>Red → Green → Refactor</b> (Kent Beck). Red: teste falha; Green: código <b>mínimo</b> para passar; Refactor: melhorar com os testes como rede de segurança.`],

[`es`,`Spring Boot`,`<p>Uma das principais vantagens do Spring Boot é:</p>`,
[`Obrigatoriedade de configuração XML extensa`,`Eliminação total da necessidade de dependências`,`Suporte exclusivo a aplicações desktop`,`Configuração automática (auto-configuration) e execução standalone`,`Substituição completa do Hibernate`],`D`,
`Spring Boot: <b>auto-configuration</b> (@EnableAutoConfiguration configura beans com base no classpath), <b>starters</b> (spring-boot-starter-web etc. agrupam dependências), <b>servidor embutido</b> (Tomcat) e <b>Actuator</b> (health, métricas). @SpringBootApplication = @Configuration + @EnableAutoConfiguration + @ComponentScan.`],

[`es`,`Arquitetura`,`<p>Em uma arquitetura de microsserviços, o uso de um API Gateway geralmente serve para:</p>`,
[`Armazenar dados persistentes`,`Substituir o banco de dados`,`Centralizar autenticação, roteamento e rate limiting`,`Compilar o código-fonte`,`Executar testes unitários`],`C`,
`API Gateway = <b>ponto único de entrada</b>: roteamento, autenticação/autorização, rate limiting, agregação, TLS. No ecossistema Spring: <b>Spring Cloud Gateway</b>.`],

[`es`,`Git`,`<p>No Git, o comando utilizado para criar uma nova branch e já alternar para ela é:</p>`,
[`git branch nova-branch`,`git checkout -b nova-branch`,`git merge nova-branch`,`git pull nova-branch`,`git commit -b nova-branch`],`B`,
`<b>git checkout -b</b> (ou o moderno <b>git switch -c</b>) cria e alterna. “git branch nome” só cria, sem alternar.`],

[`es`,`Requisitos`,`<p>A técnica de elicitação de requisitos que consiste em observar o usuário no ambiente real de trabalho é chamada de:</p>`,
[`Observação / Etnografia`,`Brainstorming`,`Prototipação`,`Análise de documentos`,`Questionário`],`A`,

[`es`,`Java`,`<p>Em Java, a palavra-chave utilizada para indicar que um método não pode ser sobrescrito em uma subclasse é:</p>`,
[`static`,`abstract`,`private`,`final`,`synchronized`],`D`,
`<b>final</b>: em classe → não pode ser herdada (ex.: String); em método → não pode ser sobrescrito; em variável → não pode ser reatribuída. Métodos private também não são sobrescritos (não são herdados), mas a palavra-chave própria para isso é final. abstract é o oposto (obriga sobrescrever).`],

[`es`,`Mensageria`,`<p>Em arquiteturas de microsserviços, o uso de um broker de mensagens (ex.: Kafka, RabbitMQ) tem como um dos principais objetivos:</p>`,

[`es`,`SOLID`,`<p>O princípio SOLID que afirma que uma classe deve ter apenas uma razão para mudar é o:</p>`,
[`Single Responsibility Principle (SRP)`,`Open/Closed Principle`,`Liskov Substitution Principle`,`Interface Segregation Principle`,`Dependency Inversion Principle`],`A`,
`<b>S</b>RP: uma razão para mudar. <b>O</b>CP: aberto a extensão, fechado a modificação. <b>L</b>SP: subclasse deve substituir a superclasse sem quebrar o comportamento. <b>I</b>SP: interfaces pequenas e específicas. <b>D</b>IP: depender de abstrações, não de implementações (base da injeção de dependência).`],

[`es`,`Containers`,`<p>Uma das principais vantagens do uso de containers (ex.: Docker) no desenvolvimento e deploy é:</p>`,

[`200`,`202`,`201`,`204`,`301`],`C`,

[`es`,`Banco de dados – ACID`,`<p>Em um banco de dados relacional, a propriedade ACID que garante que uma transação é executada por completo ou não é executada é a:</p>`,

[`es`,`Padrões de projeto`,`<p>O padrão que permite que uma família de algoritmos seja encapsulada e intercambiável em tempo de execução é o:</p>`,

[`es`,`CI/CD`,`<p>No pipeline de CI/CD, a etapa que geralmente ocorre após o build e os testes automatizados, e antes do deploy em produção, é:</p>`,

const TXT_EN1 = `<div class="texto"><b>Text I – Modernizing the Past</b><p>Many government legacy systems were written decades ago in languages such as COBOL and run on mainframes. Yet they still process millions of transactions every day, from pension payments to tax records. As experienced programmers retire, agencies face growing pressure to “rip and replace” these systems.</p><p>However, big bang migrations, in which the entire system is rewritten and switched over at once, often fail: they exceed budgets, miss deadlines and, worse, lose business rules that were never documented. An alternative is the so-called <i>strangler fig</i> pattern. New functionalities grow around the old system and gradually replace it, piece by piece, until the legacy application can finally be switched off.</p><p>Modernization is unavoidable, but it is rarely worth the risk to do it all at once.</p></div>`;

[`ia`,`LLMs – conceitos`,`<p>Sobre modelos de linguagem de grande escala (LLMs), assinale a afirmativa correta.</p>`,

[`ia`,`Engenharia de prompt`,`<p>Ao escrever um prompt, um analista inclui três exemplos de entrada e da saída esperada antes da pergunta real, para orientar o formato da resposta do modelo. Essa técnica é conhecida como:</p>`,

[`ia`,`Deep learning`,`<p>O deep learning (aprendizado profundo) caracteriza-se por:</p>`,

[`ia`,`Governo digital`,`<p>A Lei nº 14.129/2021 (Lei do Governo Digital) estabelece princípios e instrumentos para o aumento da eficiência pública. Está em consonância com essa lei:</p>`,

[`ia`,`Agentes de IA`,`<p>Os chamados “agentes de IA” diferenciam-se de um chatbot simples principalmente por:</p>`,

[`lg`,`LGPD – Anonimização`,`<p>Segundo a LGPD, os dados <b>anonimizados</b>:</p>`,

[`lg`,`LGPD – Princípios`,`<p>Um sistema coleta, no cadastro de um serviço de agendamento, dados de religião e renda familiar que não têm qualquer utilidade para o agendamento. Essa prática viola diretamente o princípio da:</p>`,

[`lg`,`LGPD – Direitos do titular`,`<p>São direitos do titular previstos no art. 18 da LGPD, EXCETO:</p>`,
[`confirmação da existência de tratamento`,`correção de dados incompletos, inexatos ou desatualizados`,`portabilidade dos dados a outro fornecedor`,`exigir a eliminação imediata de dados que o controlador precise conservar para cumprir obrigação legal`,`informação sobre as entidades com as quais o controlador compartilhou dados`],`D`,

[`lg`,`LGPD – Incidentes`,`<p>Ocorrendo incidente de segurança que possa acarretar risco ou dano relevante aos titulares, a LGPD determina que o controlador:</p>`,

[`lg`,`Lei 12.737/2012`,`<p>A Lei nº 12.737/2012, conhecida como “Lei Carolina Dieckmann”, tipificou no Código Penal a conduta de:</p>`,

[`lg`,`Marco Civil da Internet`,`<p>Segundo o Marco Civil da Internet (Lei nº 12.965/2014), o provedor de conexão deve manter os registros de conexão, sob sigilo e em ambiente seguro, pelo prazo de:</p>`,

[`lg`,`ISO 27001 / 27002`,`<p>Sobre as normas ABNT NBR ISO/IEC 27001 e 27002, é correto afirmar que:</p>`,

[`lg`,`LGPD – Poder público`,`<p>Sobre o tratamento de dados pessoais pelo poder público, a LGPD estabelece que ele deve ser realizado:</p>`,

[`es`,`Java – Strings`,`<p>Considere o trecho em Java:</p><pre><code>String a = "dev";
String b = new String("dev");
System.out.println(a == b);
System.out.println(a.equals(b));</code></pre><p>A saída será:</p>`,
[`true e true`,`true e false`,`false e false`,`erro de compilação`,`false e true`],`E`,
`<b>==</b> compara <b>referências</b> (endereço do objeto); <b>equals()</b> compara o <b>conteúdo</b>. “dev” literal fica no <i>String pool</i>; <code>new String(...)</code> cria outro objeto no heap → referências diferentes (false), conteúdo igual (true). <br>💡 <i>Em Java, compare Strings sempre com equals(). Se fosse <code>b = "dev"</code>, a == b daria true (mesmo objeto do pool).</i>`],

[`es`,`Java – Collections`,`<p>Sobre a API de Collections do Java, assinale a afirmativa correta.</p>`,
[`ArrayList não permite elementos duplicados.`,`HashSet não permite elementos duplicados e não garante ordem de iteração.`,`HashMap mantém as chaves em ordem crescente.`,`TreeSet mantém a ordem de inserção dos elementos.`,`LinkedHashMap não permite chave nula e é ordenado por valor.`],`B`,

[`es`,`Java – Exceções`,`<p>Em Java, sobre exceções, é correto afirmar que:</p>`,
[`exceções que herdam de RuntimeException são não verificadas (unchecked) e não precisam ser declaradas com throws nem tratadas obrigatoriamente.`,`IOException é uma exceção não verificada.`,`o bloco finally só é executado quando nenhuma exceção ocorre.`,`Error deve ser sempre capturado com catch.`,`uma exceção verificada (checked) dispensa tratamento se estiver dentro de um método static.`],`A`,
`Hierarquia: Throwable → <b>Error</b> (falhas graves da JVM, ex.: OutOfMemoryError — não se costuma capturar) e <b>Exception</b>. Exception → <b>checked</b> (ex.: IOException, SQLException: exigem try/catch ou throws) e <b>RuntimeException</b> → unchecked (NullPointerException, IllegalArgumentException, ArithmeticException). O <b>finally</b> executa com ou sem exceção.`],

[`es`,`Java – Streams e lambdas`,`<p>Qual o valor impresso pelo código abaixo?</p><pre><code>int r = List.of(1, 2, 3, 4, 5).stream()

System.out.println(r);</code></pre>`,

[`es`,`Java – Orientação a objetos`,`<p>Sobre interfaces e classes em Java (versão 8 ou superior), é correto afirmar que:</p>`,
[`uma classe pode estender várias classes, mas implementar apenas uma interface.`,`interfaces não podem ter métodos com implementação.`,`classes abstratas não podem ter construtores.`,`interfaces podem declarar métodos default e static com implementação, e uma classe pode implementar várias interfaces.`,`a sobrecarga (overloading) exige herança entre as classes.`],`D`,

[`es`,`Jakarta EE`,`<p>Na evolução do Java EE para o Jakarta EE, sob governança da Eclipse Foundation, uma mudança marcante a partir do Jakarta EE 9 foi:</p>`,
[`a remoção do suporte a servlets.`,`a substituição do pacote javax.* por jakarta.* nas especificações.`,`a obrigatoriedade do uso de XML em vez de anotações.`,`a extinção da especificação JPA.`,`a proibição do uso de servidores de aplicação.`],`B`,
`Por questões de marca, o Jakarta EE 9 trocou o namespace <b>javax.*</b> por <b>jakarta.*</b> (ex.: javax.persistence → <b>jakarta.persistence</b>; javax.servlet → jakarta.servlet). Por isso o Spring Boot 3 exige Jakarta EE (jakarta.*). O Jakarta EE 8 era idêntico ao Java EE 8. JPA passou a se chamar <b>Jakarta Persistence</b>.`],

[`es`,`JPA – Ciclo de vida`,`<p>Em JPA, uma entidade que foi carregada em um contexto de persistência já encerrado e que precisa voltar a ser gerenciada, com suas alterações sincronizadas, deve ser passada ao método:</p>`,
[`persist()`,`remove()`,`detach()`,`refresh()`,`merge()`],`E`,
`Estados: <b>new/transient</b> (novo, sem id gerenciado) → persist() → <b>managed</b> (alterações sincronizadas no flush/commit) → fim do contexto/detach() → <b>detached</b> → <b>merge()</b> copia o estado para uma instância gerenciada e a <b>retorna</b>; remove() → <b>removed</b>. refresh() recarrega do banco, descartando alterações. <br>💡 <i>merge() retorna a instância gerenciada; o objeto passado continua detached.</i>`],

[`es`,`JPA – Performance`,`<p>Uma consulta JPA carrega 100 pedidos e, ao percorrer a lista, a aplicação acessa o cliente de cada pedido (relacionamento LAZY), disparando 100 consultas adicionais. Esse problema e uma solução adequada são, respectivamente:</p>`,
[`problema N+1; usar JOIN FETCH na JPQL ou EntityGraph.`,`deadlock; aumentar o pool de conexões.`,`lost update; usar @Version.`,`dirty read; usar isolamento SERIALIZABLE.`,`problema N+1; trocar todas as associações para EAGER globalmente.`],`A`,
`<b>N+1</b>: 1 consulta principal + N consultas para as associações. Solução pontual: <code>SELECT p FROM Pedido p JOIN FETCH p.cliente</code> ou <b>@EntityGraph</b>/batch fetching. Tornar tudo EAGER (E) costuma piorar (carrega dados desnecessários em todo lugar). @Version resolve concorrência (<b>lock otimista</b>), não N+1.`],

[`es`,`JPA – JPQL`,`<p>Sobre a JPQL (Jakarta Persistence Query Language), é correto afirmar que:</p>`,
[`opera diretamente sobre nomes de tabelas e colunas do banco.`,`só permite consultas SELECT, sem UPDATE ou DELETE.`,`opera sobre entidades e seus atributos, sendo traduzida para o SQL do banco pelo provedor JPA.`,`é específica do banco Oracle.`,`não permite parâmetros nomeados.`],`C`,
`JPQL é <b>orientada a objetos</b>: <code>SELECT c FROM Cliente c WHERE c.nome = :nome</code> (Cliente = entidade; :nome = parâmetro nomeado). O provedor (Hibernate) gera o SQL do dialeto. Suporta SELECT, UPDATE e DELETE em massa. Para SQL puro, usa-se <b>createNativeQuery</b>. Alternativa type-safe: <b>Criteria API</b>.`],

[`es`,`Spring – Injeção de dependência`,`<p>No Spring, a forma de injeção de dependência geralmente recomendada, por favorecer imutabilidade, testabilidade e dependências obrigatórias explícitas, é a injeção:</p>`,

[`es`,`Spring – @Transactional`,`<p>Por padrão, um método anotado com @Transactional no Spring faz rollback automático quando lança:</p>`,
